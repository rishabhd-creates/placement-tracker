<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>10-Month Placement Tracker — Morgan Stanley · JPMorgan · Deloitte</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d23;--mu:#5b6270;--ac:#0b5cff;--ok:#12805c;--bd:#dfe3ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151a;--card:#1b2027;--tx:#e8ebf0;--mu:#9aa3b2;--ac:#6ea0ff;--ok:#4cc9a0;--bd:#2c333d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151a;--card:#1b2027;--tx:#e8ebf0;--mu:#9aa3b2;--ac:#6ea0ff;--ok:#4cc9a0;--bd:#2c333d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:960px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:0 0 8px}
.mu{color:var(--mu);font-size:13px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
.r{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button.on{outline:2px solid var(--ac)}button.dn{border-color:var(--ok);color:var(--ok);font-weight:600}
a.b{display:inline-block;padding:6px 12px;border-radius:8px;border:1px solid var(--ac);color:var(--ac);text-decoration:none;font-weight:600;font-size:13px}
.h{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}.h:first-of-type{border-top:0}
.h input{width:20px;height:20px;margin-top:3px;flex:none}
textarea{width:100%;min-height:110px;resize:vertical}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px;border-top:1px solid var(--bd);text-align:left}
.tg{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bd)}
</style></head><body><div class="w" id="app"></div>
<script>
const R={
py:["CS50P Python","https://cs50.harvard.edu/python/","Kaggle Python","https://www.kaggle.com/learn/python"],
oop:["Python Classes docs","https://docs.python.org/3/tutorial/classes.html","HackerRank Python","https://www.hackerrank.com/domains/python"],
dsa:["GeeksforGeeks DSA","https://www.geeksforgeeks.org/data-structures/","LeetCode","https://leetcode.com/problemset/"],
nc:["NeetCode roadmap","https://neetcode.io/roadmap","NeetCode 150","https://neetcode.io/practice"],
ex:["Microsoft Excel help","https://support.microsoft.com/en-us/excel","Excel formulas overview","https://support.microsoft.com/en-us/excel/get-started/overview-of-formulas-in-excel"],
sql:["SQLBolt","https://sqlbolt.com/","HackerRank SQL","https://www.hackerrank.com/domains/sql"],
sqa:["Mode SQL tutorial","https://mode.com/sql-tutorial/","LeetCode Database","https://leetcode.com/problemset/database/"],
st:["OpenIntro Statistics","https://www.openintro.org/book/os/","Khan Academy Statistics","https://www.khanacademy.org/math/statistics-probability"],
pd:["Kaggle Pandas","https://www.kaggle.com/learn/pandas","Kaggle Data Cleaning","https://www.kaggle.com/learn/data-cleaning"],
viz:["Kaggle Data Visualization","https://www.kaggle.com/learn/data-visualization","Kaggle Datasets","https://www.kaggle.com/datasets"],
bi:["Microsoft Learn Power BI","https://learn.microsoft.com/en-us/training/powerplatform/power-bi","MS Learn Data Analyst path","https://learn.microsoft.com/en-us/training/career-paths/data-analyst"],
tab:["Tableau free training","https://www.tableau.com/learn/training","Tableau Public","https://public.tableau.com/"],
ml:["Kaggle Intro to ML","https://www.kaggle.com/learn/intro-to-machine-learning","Scikit-learn user guide","https://scikit-learn.org/stable/user_guide.html"],
db:["GeeksforGeeks DBMS","https://www.geeksforgeeks.org/dbms/","DBMS questions","https://www.geeksforgeeks.org/dbms-gq/"],
os:["GeeksforGeeks OS","https://www.geeksforgeeks.org/operating-systems/","OS questions","https://www.geeksforgeeks.org/operating-systems-gq/"],
cn:["GeeksforGeeks Networks","https://www.geeksforgeeks.org/computer-networks/","CN questions","https://www.geeksforgeeks.org/computer-networks-gq/"],
git:["GitHub Docs","https://docs.github.com/en/get-started","GitHub Skills","https://skills.github.com/"],
sd:["System Design Primer","https://github.com/donnemartin/system-design-primer","NeetCode system design","https://neetcode.io/practice"],
cloud:["AWS Cloud Practitioner Essentials","https://aws.amazon.com/training/digital/aws-cloud-practitioner-essentials/","Microsoft Learn Azure","https://learn.microsoft.com/en-us/training/azure/"],
fin:["Khan Academy Finance","https://www.khanacademy.org/economics-finance-domain/core-finance","Investopedia","https://www.investopedia.com/"],
case:["Deloitte Careers","https://www.deloitte.com/global/en/careers.html","Pramp mock interviews","https://www.pramp.com/"],
apt:["IndiaBix aptitude","https://www.indiabix.com/","IndiaBix practice","https://www.indiabix.com/online-test/aptitude-test/"],
hr:["STAR method guide","https://www.themuse.com/advice/star-interview-method","Pramp mock interviews","https://www.pramp.com/"],
co:["Morgan Stanley Careers","https://www.morganstanley.com/careers","JPMorgan Careers","https://careers.jpmorgan.com/"]};
const M=["Python + Excel Foundations","OOP + SQL Basics + DSA Intro","Advanced SQL + Statistics","DSA Core Patterns","Advanced DSA + NumPy/Pandas","Analytics: EDA, Power BI, Tableau","CS Fundamentals + System Design","Finance + ML + Business Cases","Aptitude + Resume + Behavioural","Company Prep + Mocks + Applications"];
const G=["Write clean Python; Excel lookups and pivots","OOP, SQL joins, Big-O, recursion","Window functions, CTEs, hypothesis testing","Solve Easy/Medium: linked list, stack, trees, heaps","Graphs, DP, 90-minute mock coding tests","Two dashboards + EDA project on GitHub","DBMS, OS, CN, Git, low-level design","Finance basics + 2 ML projects + case frameworks","Aptitude speed, ATS resume, STAR stories","Company-specific mocks and applications sent"];
const U=[
["Python syntax, variables, data types, I/O|py","Operators, conditions, if-elif-else|py","Loops, break/continue, pattern problems|py","Lists, tuples and slicing|py","Sets, dictionaries, strings|py","Functions, args, lambda, comprehensions|py","Exceptions, file handling, modules, venv|py","Excel: tables, sorting, filtering, data validation|ex","Excel: IF, AND/OR, SUMIFS, COUNTIFS|ex","Excel: VLOOKUP, XLOOKUP, INDEX-MATCH|ex","Excel: pivot tables, charts, conditional formatting|ex","Project: expense tracker (Python + Excel report)|py"],
["OOP: classes, objects, constructors|oop","OOP: encapsulation and inheritance|oop","OOP: polymorphism, abstraction, SOLID basics|oop","Big-O, time/space complexity, arrays|dsa","Strings, two-pointer basics, hashing|dsa","SQL: SELECT, WHERE, DISTINCT, ORDER BY, LIMIT|sql","SQL: aggregates, GROUP BY, HAVING|sql","SQL: CASE WHEN, NULLs, string/date functions|sql","SQL: INNER, LEFT, RIGHT, FULL, SELF joins|sql","Linear/binary search and sorting algorithms|dsa","Recursion and backtracking intro|dsa","Project: banking system (OOP + SQL)|oop"],
["SQL: subqueries (scalar, correlated, EXISTS)|sqa","SQL: CTEs and recursive CTEs|sqa","SQL: ROW_NUMBER, RANK, DENSE_RANK|sqa","SQL: LAG, LEAD, running totals, moving averages|sqa","SQL interview set: Nth highest, duplicates, gaps, retention|sqa","SQL: indexes, views, transactions, optimisation|sqa","Stats: mean, median, mode, variance, SD|st","Stats: percentiles, IQR, z-score, outliers|st","Probability, conditional probability, Bayes|st","Distributions: normal, binomial, Poisson|st","Hypothesis testing, p-value, t-test, chi-square, A/B test|st","Correlation, covariance, confidence intervals|st"],
["Hash map/set problem patterns|nc","Two pointers and sliding window|nc","Prefix sums and binary search patterns|nc","Linked list: reverse, cycle, merge|nc","Stack and monotonic stack|nc","Queue, deque, circular queue|nc","Trees: traversals, DFS/BFS|nc","BST: insert, validate, LCA|nc","Heaps, priority queue, top-K|nc","Tries and intervals|nc","Mixed timed set: 4 problems in 90 min|dsa","Month review: redo every wrong problem|dsa"],
["Graphs: representation, BFS, DFS|nc","Graphs: components, islands, topological sort|nc","Union-Find and Dijkstra|nc","Greedy algorithms|nc","Backtracking: subsets, permutations, N-Queens|nc","DP 1-D: stairs, house robber, coin change|nc","DP 2-D: knapsack, LCS, grid paths|nc","NumPy arrays and broadcasting|pd","Pandas: Series, DataFrame, filtering|pd","Pandas: groupby, merge, pivot|pd","Data cleaning: missing, duplicates, dtypes, dates|pd","Mock online assessment: 3 problems, 90 min|dsa"],
["EDA: univariate and bivariate analysis|viz","Matplotlib and Seaborn charts|viz","Choosing the right chart, storytelling|viz","Power BI: import, visuals, slicers|bi","Power BI: Power Query transformations|bi","Data modelling: star schema, relationships|bi","DAX: measures, CALCULATE, time intelligence|bi","Tableau: dimensions, measures, dashboards|tab","Tableau: calculated fields, LOD, parameters|tab","Project: banking transactions dashboard|bi","Project: Python EDA notebook on a financial dataset|viz","Project: publish both to GitHub with README|git"],
["DBMS: keys, constraints, ER, normalisation|db","DBMS: ACID, transactions, concurrency, indexing|db","OS: process, thread, scheduling|os","OS: deadlock, paging, virtual memory|os","CN: OSI, TCP/IP, TCP vs UDP|cn","CN: HTTP/HTTPS, DNS, DHCP, REST APIs|cn","Git workflow: branches, pull requests|git","Linux/shell basics, SDLC, Agile/Scrum|git","System design: scalability, caching, load balancing|sd","Low-level design: parking lot, ATM|sd","Cloud basics: AWS/Azure, APIs, microservices|cloud","Core CS revision quiz and weak areas|db"],
["Finance basics: markets, banking, financial statements|fin","Time value of money, ratios, risk and return|fin","Investment banking, asset and wealth management overview|fin","Current affairs: markets, RBI, fintech, AI in banking|fin","ML: supervised vs unsupervised, overfitting|ml","ML: linear and logistic regression|ml","ML: decision trees, random forest, KNN|ml","ML: precision, recall, F1, ROC-AUC|ml","Project: loan default prediction|ml","Project: fraud detection analysis|ml","Business problem solving: KPIs, frameworks|case","Consulting case practice + Excel case study|case"],
["Quant: percentages, ratio, profit-loss, time-work|apt","Quant: probability, permutations, data interpretation|apt","Logical reasoning: series, puzzles, seating|apt","Verbal: reading comprehension, grammar|apt","Timed aptitude mock (60 min) and analysis|apt","Resume: ATS format, action + metric bullets|hr","Resume: projects, GitHub, LinkedIn polish|hr","Behavioural: STAR stories (leadership, failure)|hr","HR: self-intro, why this company, strengths|hr","Communication: group discussion, email writing|hr","Portfolio site on GitHub Pages|git","Full SQL + Python mock assessment|sqa"],
["Morgan Stanley: role research + coding test practice|co","Morgan Stanley: CS fundamentals + finance Q&A|co","JPMorgan: SEP / Code for Good preparation|co","JPMorgan: HackerRank-style test + Superday practice|co","Deloitte: aptitude + technical test practice|co","Deloitte: analytics, consulting, case interviews|case","DSA final sprint: top 75 problems|nc","SQL + Python + Excel final sprint|sqa","Mock technical interview (peer or Pramp)|hr","Mock HR + managerial interview|hr","Applications: careers pages, referrals, outreach|co","Final self-audit, weak areas, buffer and rest|hr"]];
const CODE=["py","oop","dsa","nc","sql","sqa","pd"];
const S="msjpmdt10";let st={d:{},w:{},s:{}};
try{st=Object.assign(st,JSON.parse(localStorage.getItem(S)||"{}"))}catch(e){}
function sv(){try{localStorage.setItem(S,JSON.stringify(st))}catch(e){}}
let m=0,w=0,d=0,tab="day";
const K=(a,b,c)=>`m${a}w${b}d${c}`;
const pl=(a,b,c)=>{const u=U[a][b*3+(c>>1)].split("|");return{t:u[0],k:u[1],B:c%2==1}};
const dd=(a,b,c)=>{const x=st.d[K(a,b,c)];return !!x&&!!x.h&&x.h.filter(Boolean).length==3};
function hrs(p){const t=p.t,cd=CODE.includes(p.k),pj=/Project|Mock|mock|Mini|sprint/.test(t);
if(pj)return p.B?[["Hour 2 — REVIEW","Review yesterday’s work on: "+t+". Fix errors first."],["Hour 2 — BUILD","Continue: "+t+". Finish the next major section."],["Hour 3 — TEST + SAVE","Test the result, write 3 insights, save or push to GitHub."]].map((x,i)=>[["Hour 1 — REVIEW","Hour 2 — BUILD","Hour 3 — TEST + SAVE"][i],x[1]]):[["Hour 1 — LEARN","Study the tools/concepts needed for: "+t+"."],["Hour 2 — BUILD","Start: "+t+". Build the first working section yourself."],["Hour 3 — DOCUMENT","Save work, write what is done vs pending, plan tomorrow."]];
if(!p.B)return[["Hour 1 — LEARN","Study: "+t+". Use the Learn and YouTube buttons. Write 5–10 notes and 3 examples."],["Hour 2 — PRACTICE",cd?"Solve 4–5 problems on "+t+" (Practice link). Try 20 min before any hint.":"Do 5+ exercises or questions on "+t+" yourself, no copying."],["Hour 3 — RECALL + NOTES","Close the material. Recreate the key points from memory. Write: definition, steps, 2 mistakes, 3 takeaways."]];
return[["Hour 1 — REVISE","Explain "+t+" aloud from memory, then check notes and fix gaps."],["Hour 2 — INDEPENDENT PRACTICE",cd?"Solve 3–5 new problems on "+t+", 1 timed at 25 min.":"Do 5–10 fresh questions on "+t+" without the lesson open."],["Hour 3 — MINI TASK + INTERVIEW","Build one small task using "+t+". Write and answer 3 interview questions on it."]]}
function go(a,b,c){m=a;w=b;d=c;tab="day";draw()}
function gm(v){go(+v,0,0)}
function nx(s){let a=m,b=w,c=d+s;if(c>5){c=0;b++}if(c<0){c=5;b--}if(b>3){b=0;a++}if(b<0){b=3;a--}if(a<0||a>9)return;go(a,b,c)}
function nxt(){for(let a=0;a<10;a++)for(let b=0;b<4;b++)for(let c=0;c<6;c++)if(!dd(a,b,c))return go(a,b,c)}
function th(i){const k=K(m,w,d),x=st.d[k]=st.d[k]||{h:[0,0,0],n:""};x.h[i]=!x.h[i];sv();draw()}
function fin(){const k=K(m,w,d),x=st.d[k]=st.d[k]||{h:[0,0,0],n:""};const all=x.h.every(Boolean);x.h=[!all,!all,!all];sv();draw()}
function nt(v){const k=K(m,w,d),x=st.d[k]=st.d[k]||{h:[0,0,0],n:""};x.n=v;sv()}
function wn(v){st.w[m+"_"+w]=v;sv()}
function sc(i){const k=m+"_"+w+"_"+i;st.s[k]=!st.s[k];sv()}
function tb(t){tab=t;draw()}
function pc(n,t){return Math.round(n/t*100)}
function wkDone(a,b){let n=0;for(let c=0;c<6;c++)if(dd(a,b,c))n++;return n}
function draw(){
let h=`<h1>🎯 10-Month Placement Tracker</h1><div class="mu">Technology + Analyst roles · Morgan Stanley · JPMorgan Chase · Deloitte · 3 h/day · 6 days/week · Sunday buffer</div>
<div class="c"><div class="r"><select onchange="gm(this.value)">${M.map((x,i)=>`<option value="${i}" ${i==m?"selected":""}>Month ${i+1} — ${x}</option>`).join("")}</select>
<button onclick="nxt()" class="p">Jump to next incomplete day</button><button onclick="tb('dash')" class="${tab=="dash"?"on":""}">📊 Dashboard</button></div>
<div class="mu" style="margin-top:8px">🎯 Month goal: ${G[m]}</div>
<div class="r" style="margin-top:8px">${[0,1,2,3].map(b=>`<button class="${b==w&&tab!="dash"?"on":""} ${wkDone(m,b)==6?"dn":""}" onclick="go(m,${b},0)">Week ${b+1} (${wkDone(m,b)}/6)</button>`).join("")}</div>
<div class="r" style="margin-top:8px">${[0,1,2,3,4,5].map(c=>`<button class="${c==d&&tab=="day"?"on":""} ${dd(m,w,c)?"dn":""}" onclick="go(m,w,${c})">Day ${c+1}${dd(m,w,c)?" ✓":""}</button>`).join("")}<button class="${tab=="sun"?"on":""}" onclick="tb('sun')">☀ Sunday</button></div></div>`;
if(tab=="day"){const p=pl(m,w,d),x=st.d[K(m,w,d)]||{h:[0,0,0],n:""},r=R[p.k],g=m*24+w*6+d+1;
h+=`<div class="c"><h2>DAY ${g} / 240 · Month ${m+1} · Week ${w+1} · Day ${d+1}</h2><div><span class="tg">${p.B?"Part 2 of 2 — practice and apply":"Part 1 of 2 — learn and practise"}</span></div><p style="font-size:17px;margin:8px 0"><b>Focus: ${p.t}</b></p>
<div class="r"><a class="b" target="_blank" rel="noopener" href="${r[1]}">📖 Learn: ${r[0]}</a><a class="b" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(p.t.replace(/^[A-Za-z ]+: /,"")+" tutorial")}">▶ YouTube</a><a class="b" target="_blank" rel="noopener" href="${r[3]}">🧪 Practice: ${r[2]}</a></div></div>
<div class="c"><h2>⏱ Exact 3-hour routine</h2>${hrs(p).map((q,i)=>`<label class="h"><input type="checkbox" ${x.h[i]?"checked":""} onchange="th(${i})"><span><b>${q[0]}</b><br>${q[1]}</span></label>`).join("")}
<div class="r"><button onclick="fin()">${x.h.every(Boolean)?"Undo day complete":"✅ Mark all 3 hours done"}</button></div></div>
<div class="c"><h2>📝 What I learned today</h2><textarea oninput="nt(this.value)" placeholder="Learned · confused me · mistakes · 3 key points · revise tomorrow">${(x.n||"").replace(/</g,"&lt;")}</textarea></div>
<div class="r"><button onclick="nx(-1)">◀ Previous day</button><button class="p" onclick="nx(1)">Next day ▶</button></div>`}
if(tab=="sun"){const L=["Catch up on any missed weekday","Redo every question you got wrong this week","Review notes without videos (active recall)","Do 1 timed mock (coding, SQL or aptitude, 60–90 min)","Update GitHub and resume with this week’s work","Plan next week’s 6 days","If all done: REST fully"];
h+=`<div class="c"><h2>☀ Sunday — Buffer / revision (Month ${m+1}, Week ${w+1})</h2><div class="mu">Weekly target 18 h: ${wkDone(m,w)}/6 days done. Do not double next week’s load to compensate.</div>${L.map((q,i)=>`<label class="h"><input type="checkbox" ${st.s[m+"_"+w+"_"+i]?"checked":""} onchange="sc(${i})"><span>${q}</span></label>`).join("")}</div>
<div class="c"><h2>Weekly review</h2><textarea oninput="wn(this.value)" placeholder="Wins · weak topics · what to fix next week">${(st.w[m+"_"+w]||"").replace(/</g,"&lt;")}</textarea></div>`}
if(tab=="dash"){let t=0;const rows=M.map((x,a)=>{let n=0,hh=0;for(let b=0;b<4;b++)for(let c=0;c<6;c++){if(dd(a,b,c))n++;const e=st.d[K(a,b,c)];if(e&&e.h)hh+=e.h.filter(Boolean).length}t+=n;return`<tr><td>${a+1}. ${x}</td><td>${n}/24</td><td>${hh}/72</td><td style="width:25%"><div class="bar"><i style="width:${pc(n,24)}%"></i></div></td></tr>`}).join("");
h+=`<div class="c"><h2>📊 Overall: ${t}/240 days (${pc(t,240)}%)</h2><div class="bar"><i style="width:${pc(t,240)}%"></i></div></div><div class="c" style="overflow-x:auto"><table><tr><th>Month</th><th>Days</th><th>Hours</th><th></th></tr>${rows}</table></div>
<div class="c"><h2>Company links</h2><div class="r"><a class="b" target="_blank" rel="noopener" href="https://www.morganstanley.com/careers">Morgan Stanley</a><a class="b" target="_blank" rel="noopener" href="https://careers.jpmorgan.com/">JPMorgan Chase</a><a class="b" target="_blank" rel="noopener" href="https://www.deloitte.com/global/en/careers.html">Deloitte</a></div><div class="mu" style="margin-top:8px">Progress is saved in this browser only.</div></div>`}
document.getElementById("app").innerHTML=h}
draw();
</script></body></html>
