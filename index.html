function nb(p,a,b,c){const n=N[a][b*3+(c>>1)].split("|");return `<h2 style="margin-top:12px">📝 Notes: what to cover</h2><div class="nt ${p.B?"":"cur"}"><b>Part 1 · Learn / start</b>${p.B?"":" (today)"}<br>${n[0]}</div><div class="nt ${p.B?"cur":""}"><b>Part 2 · Practise / build</b>${p.B?" (today)":""}<br>${n[1]}</div>`}
const S="msjpmdt10b";let st={d:{},w:{},s:{}};
try{st=Object.assign(st,JSON.parse(localStorage.getItem(S)||"{}"))}catch(e){}
function sv(){try{localStorage.setItem(S,JSON.stringify(st))}catch(e){}}
let m=0,w=0,d=0,tab="day";
const K=(a,b,c)=>`m${a}w${b}d${c}`;
const pl=(a,b,c)=>{const u=U[a][b*3+(c>>1)].split("|");return{t:u[0],k:u[1],B:c%2==1}};
const dd=(a,b,c)=>{const x=st.d[K(a,b,c)];return !!x&&!!x.h&&x.h.filter(Boolean).length==3};
const MK=["Coding OA: 2 problems, 60 min","SQL + DBMS quiz, 45 min","Aptitude test, 45 min","Mixed: 1 coding problem + 10 aptitude questions"];
function hrs(p,a,b,c){const t=p.t,pj=/^Project|^Mock|^Month review|^Final/.test(t);
const h3=c==5?["Hour 3 — WEEKLY MOCK","Timed mock: "+MK[b]+". Review every mistake after. Log your score in the notes."]:["Hour 3 — DSA + REVISION","DSA focus: "+D[a][b]+". Solve 2–3 problems (Java). Then redo 2 wrong problems from last week."];
if(pj)return p.B?[["Hour 1 — REVIEW","Review yesterday’s work on: "+t+". Fix errors first."],["Hour 2 — BUILD","Continue: "+t+". Finish the next major section."],h3]:[["Hour 1 — LEARN","Study the tools/concepts needed for: "+t+"."],["Hour 2 — BUILD","Start: "+t+". Build the first working section yourself."],h3];
if(!p.B)return[["Hour 1 — LEARN","Study: "+t+". Use Learn and YouTube. Write 5–10 notes and 3 examples."],["Hour 2 — PRACTICE","Do 5+ exercises or questions on "+t+" yourself, no copying. Try 20 min before any hint."],h3];
return[["Hour 1 — REVISE","Explain "+t+" aloud from memory, then check notes and fix gaps."],["Hour 2 — INDEPENDENT PRACTICE + MINI TASK","Do 5–10 fresh questions on "+t+". Then write and answer 3 interview questions on it."],h3]}
function go(a,b,c){m=a;w=b;d=c;tab="day";draw()}
function gm(v){go(+v,0,0)}
function nx(s){let a=m,b=w,c=d+s;if(c>5){c=0;b++}if(c<0){c=5;b--}if(b>3){b=0;a++}if(b<0){b=3;a--}if(a<0||a>9)return;go(a,b,c)}
function nxt(){for(let a=0;a<10;a++)for(let b=0;b<4;b++)for(let c=0;c<6;c++)if(!dd(a,b,c))return go(a,b,c)}
function gx(){const k=K(m,w,d);return st.d[k]=st.d[k]||{h:[0,0,0],n:""}}
function th(i){const x=gx();x.h[i]=!x.h[i];sv();draw()}
function fin(){const x=gx(),a=x.h.every(Boolean);x.h=[!a,!a,!a];sv();draw()}
function nt(v){gx().n=v;sv()}
function wn(v){st.w[m+"_"+w]=v;sv()}
function sc(i){const k=m+"_"+w+"_"+i;st.s[k]=!st.s[k];sv()}
function tb(t){tab=t;draw()}
const pc=(n,t)=>Math.round(n/t*100);
function wkH(a,b){let n=0;for(let c=0;c<6;c++){const e=st.d[K(a,b,c)];if(e&&e.h)n+=e.h.filter(Boolean).length}return n}
function wkDone(a,b){let n=0;for(let c=0;c<6;c++)if(dd(a,b,c))n++;return n}
function imp(){try{const o=JSON.parse(document.getElementById("bk").value);if(!o.d)throw 0;st=o;sv();alert("Progress imported");draw()}catch(e){alert("Invalid backup text")}}
function esc(s){return(s||"").replace(/</g,"&lt;")}
function draw(){
let h=`<h1>🎯 10-Month Placement Tracker — Java-first</h1><div class="mu">Morgan Stanley · JPMorgan Chase · Deloitte · 3 h/day · 6 days/week · Sunday buffer · daily DSA · weekly mock</div>
<div class="c"><div class="r"><select onchange="gm(this.value)">${M.map((x,i)=>`<option value="${i}" ${i==m?"selected":""}>Month ${i+1} — ${x}</option>`).join("")}</select>
<button onclick="nxt()" class="p">Jump to next incomplete day</button><button onclick="tb('dash')" class="${tab=="dash"?"on":""}">📊 Dashboard + Backup</button></div>
<div class="mu" style="margin-top:8px">🎯 Month goal: ${G[m]} · This week: ${wkH(m,w)}/18 hours</div>
<div class="r" style="margin-top:8px">${[0,1,2,3].map(b=>`<button class="${b==w&&tab!="dash"?"on":""} ${wkDone(m,b)==6?"dn":""}" onclick="go(m,${b},0)">Week ${b+1} (${wkDone(m,b)}/6)</button>`).join("")}</div>
<div class="r" style="margin-top:8px">${[0,1,2,3,4,5].map(c=>`<button class="${c==d&&tab=="day"?"on":""} ${dd(m,w,c)?"dn":""}" onclick="go(m,w,${c})">Day ${c+1}${c==5?" (mock)":""}${dd(m,w,c)?" ✓":""}</button>`).join("")}<button class="${tab=="sun"?"on":""}" onclick="tb('sun')">☀ Sunday</button></div></div>`;
if(tab=="day"){const p=pl(m,w,d),x=st.d[K(m,w,d)]||{h:[0,0,0],n:""},r=R[p.k],g=m*24+w*6+d+1;
h+=`<div class="c"><h2>DAY ${g} / 240 · Month ${m+1} · Week ${w+1} · Day ${d+1}</h2><span class="tg">${p.B?"Part 2 of 2 — practise and apply":"Part 1 of 2 — learn and practise"}</span><p style="font-size:17px;margin:8px 0"><b>Focus: ${p.t}</b></p>
<div class="r"><a class="b" target="_blank" rel="noopener" href="${r[1]}">📖 Learn: ${r[0]}</a><a class="b" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(p.t.replace(/^[A-Za-z /]+: /,"")+" tutorial")}">▶ YouTube</a><a class="b" target="_blank" rel="noopener" href="${r[3]}">🧪 Practice: ${r[2]}</a>${d==5||m==4||m==5?`<a class="b" target="_blank" rel="noopener" href="${R.nc[3]}">🧩 DSA: NeetCode 150</a>`:""}<button class="bn" onclick="tn()">📝 Notes ${nv?"▲":"▼"}</button></div>${nv?nb(p,m,w,d):""}</div>
<div class="c"><h2>⏱ Exact 3-hour routine</h2>${hrs(p,m,w,d).map((q,i)=>`<label class="h"><input type="checkbox" ${x.h[i]?"checked":""} onchange="th(${i})"><span><b>${q[0]}</b><br>${q[1]}</span></label>`).join("")}
<div class="r"><button onclick="fin()">${x.h.every(Boolean)?"Undo day complete":"✅ Mark all 3 hours done"}</button></div></div>
<div class="c"><h2>📝 What I learned today</h2><textarea oninput="nt(this.value)" placeholder="Learned · confused me · mistakes · 3 key points · revise tomorrow">${esc(x.n)}</textarea></div>
<div class="r"><button onclick="nx(-1)">◀ Previous day</button><button class="p" onclick="nx(1)">Next day ▶</button></div>`}
if(tab=="sun"){const L=["Catch up on any missed weekday","Redo every question you got wrong this week","Review notes without videos (active recall)","Write 5 interview questions from this week and answer aloud","Update GitHub and resume with this week’s work","Plan next week’s 6 days","If all done: REST fully"];
h+=`<div class="c"><h2>☀ Sunday — Buffer / revision (Month ${m+1}, Week ${w+1})</h2><div class="mu">Weekly target: ${wkH(m,w)}/18 hours, ${wkDone(m,w)}/6 days. Do not double next week’s load to compensate.</div>${L.map((q,i)=>`<label class="h"><input type="checkbox" ${st.s[m+"_"+w+"_"+i]?"checked":""} onchange="sc(${i})"><span>${q}</span></label>`).join("")}</div>
<div class="c"><h2>Weekly review</h2><textarea oninput="wn(this.value)" placeholder="Wins · weak topics · what to fix next week">${esc(st.w[m+"_"+w])}</textarea></div>`}
if(tab=="dash"){let t=0;const rows=M.map((x,a)=>{let n=0,hh=0;for(let b=0;b<4;b++){n+=wkDone(a,b);hh+=wkH(a,b)}t+=n;return`<tr><td>${a+1}. ${x}</td><td>${n}/24</td><td>${hh}/72</td><td style="width:22%"><div class="bar"><i style="width:${pc(n,24)}%"></i></div></td></tr>`}).join("");
h+=`<div class="c"><h2>📊 Overall: ${t}/240 days (${pc(t,240)}%)</h2><div class="bar"><i style="width:${pc(t,240)}%"></i></div></div><div class="c" style="overflow-x:auto"><table><tr><th>Month</th><th>Days</th><th>Hours</th><th></th></tr>${rows}</table></div>
<div class="c"><h2>💾 Backup / restore</h2><div class="mu">Copy this text and keep it safe. To restore on another device, paste it here and press Import.</div><textarea id="bk">${esc(JSON.stringify(st))}</textarea><div class="r" style="margin-top:8px"><button class="p" onclick="imp()">Import pasted backup</button></div></div>
<div class="c"><h2>Company links</h2><div class="r"><a class="b" target="_blank" rel="noopener" href="${R.co[1]}">Morgan Stanley</a><a class="b" target="_blank" rel="noopener" href="${R.co[3]}">JPMorgan Chase</a><a class="b" target="_blank" rel="noopener" href="${R.dl[1]}">Deloitte India</a></div></div>`}
document.getElementById("app").innerHTML=h}
draw();
</script></body></html>
