"<b>Concepts</b><br>• JVM runs bytecode, JRE = JVM + libraries, JDK = JRE + compiler (javac). Write once, run anywhere.<br>• Program anatomy: class, public static void main(String[] args); statements end with ;<br>• Primitives: byte, short, int, long, float, double, char, boolean. String is an object.<br>• Casting: widening is automatic (int to double); narrowing needs (int) and can lose data.<br>• Input: Scanner sc = new Scanner(System.in); nextInt(), nextLine(). Output: print, println, printf.<br><b>Watch out</b>: nextInt() leaves the newline behind; call nextLine() once before reading a full line.|<b>Tasks</b><br>1. Install JDK 21 and IntelliJ; run Hello World.<br>2. Compile one file with javac and run it with java.<br>3. Write: swap two numbers, simple interest, Celsius to Fahrenheit, area of a circle, read name and age and greet.<br>4. Print the max and min of int and double using Integer.MAX_VALUE.<br><b>Check</b>: explain JDK vs JRE vs JVM aloud in 30 seconds.",
"<b>Concepts</b><br>• Operators: + - * / % (integer division truncates; % gives the remainder), relational (== != < >), logical (&& || ! with short-circuit), bitwise (& | ^ << >>).<br>• x++ uses then increments; ++x increments then uses.<br>• Precedence: * / % before + -; relational before &&; use brackets when unsure.<br>• if / else if / else, nested conditions, ternary (cond ? a : b).<br>• switch: case, break, default, fall-through; arrow form (case 1 -> ...) in Java 14+.<br><b>Watch out</b>: = assigns, == compares; compare Strings with equals.|<b>Tasks</b><br>1. Even or odd, positive/negative/zero, leap year, largest of three.<br>2. Grade calculator (marks to A/B/C/F) with if-else, then redo with switch.<br>3. Menu calculator: read two numbers and an operator, switch on it, handle divide by zero.<br>4. Predict the output of 5 ++/-- puzzles on paper, then run them.<br><b>Check</b>: explain short-circuit evaluation with an example.",
"<b>Concepts</b><br>• for (init; condition; update), while (checks first), do-while (runs at least once).<br>• break exits the loop; continue skips to the next iteration; labelled break for nested loops.<br>• Nested loops: outer = rows, inner = columns; iterations = rows x columns.<br>• Digit tricks: n % 10 is the last digit, n / 10 drops it.<br>• Pattern method: for each row decide the spaces and symbols, then write the formula using the row number.<br><b>Watch out</b>: off-by-one errors and infinite loops from a forgotten update.|<b>Tasks</b><br>1. Factorial, sum of digits, reverse a number, palindrome number.<br>2. Fibonacci up to n; prime check up to sqrt(n); primes from 1 to 100.<br>3. Ten patterns: right triangle, inverted triangle, pyramid, diamond, number triangle, Floyd's triangle.<br>4. Dry-run one nested loop on paper with a trace table.<br><b>Check</b>: explain why a prime check only needs to go up to sqrt(n).",
"<b>Concepts</b><br>• Method = name + parameters + return type + body; void returns nothing.<br>• Java is always pass-by-value: primitives copy the value; object references copy the address, so changing an object's fields inside a method is visible outside, but reassigning the reference is not.<br>• Overloading: same name, different parameter list (return type alone is not enough); resolved at compile time.<br>• Scope: a local variable lives only in its block; fields live with the object or class.<br>• Recursion: needs a base case and a smaller subproblem.<br><b>Watch out</b>: a missing base case gives StackOverflowError.|<b>Tasks</b><br>1. MathUtil class: isPrime, gcd, power, reverseNumber, isArmstrong.<br>2. Overload area() for circle, rectangle and triangle.<br>3. Recursion: factorial, Fibonacci, sum of digits, power; draw the call stack for factorial(4).<br>4. Prove with code that swapping two ints inside a method does not change the caller's values.<br><b>Check</b>: explain pass-by-value using an object example.",
"<b>Concepts</b><br>• Array: fixed size, one type, zero-indexed; int[] a = new int[5]; a.length; defaults are 0, false, null.<br>• Traverse with for and for-each; out-of-range index throws ArrayIndexOutOfBoundsException.<br>• Arrays class: sort, fill, copyOf, copyOfRange, equals, toString, binarySearch (sorted data only).<br>• 2-D arrays: int[][] m = new int[3][4]; row-major traversal; jagged arrays have rows of different lengths.<br>• Patterns: running max/min, swap from both ends, shifting, frequency array.<br><b>Watch out</b>: b = a copies the reference, not the data.|<b>Tasks</b><br>1. Max, min, second largest, sum, average.<br>2. Reverse in place; rotate by k; move zeros to the end.<br>3. Matrix: add, multiply, transpose, row sums, column sums, diagonal sum.<br>4. Print a 2-D array with Arrays.deepToString.<br><b>Check</b>: write second largest in one pass without sorting.",
"<b>Concepts</b><br>• String is immutable: every change creates a new object; the string pool reuses identical literals.<br>• == compares references, equals compares content; equalsIgnoreCase; compareTo for ordering.<br>• Methods: length, charAt, substring, indexOf, lastIndexOf, contains, startsWith, split, replace, trim, toCharArray, toUpperCase.<br>• StringBuilder is mutable (append, insert, reverse, deleteCharAt); StringBuffer is the thread-safe, slower version.<br>• Use StringBuilder inside loops; += on Strings creates many objects.<br><b>Watch out</b>: new String(x) bypasses the pool, so == can be false.|<b>Tasks</b><br>1. Reverse a string two ways (StringBuilder and a char loop).<br>2. Palindrome, vowel and consonant count, remove spaces, count words.<br>3. Anagram check (sort and frequency array), first non-repeating character, character frequency.<br>4. Show with code why == and equals differ for new String objects.<br><b>Check</b>: explain immutability and why it helps security and the pool.",

"<b>Concepts</b><br>• extends gives a subclass the parent's fields and methods (IS-A); Java allows single inheritance for classes.<br>• super(...) calls the parent constructor (first line); super.method() calls the parent version.<br>• Overriding: same name and parameters, @Override, access cannot be reduced, return type same or narrower.<br>• Object class: toString, equals, hashCode; override toString for readable output.<br>• final: variable cannot change, method cannot be overridden, class cannot be extended.<br><b>Watch out</b>: overloading is decided at compile time, overriding at runtime.|<b>Tasks</b><br>1. Vehicle with Car and Bike subclasses, each adding a field and overriding describe().<br>2. Shape hierarchy (Circle, Rectangle) with area() overridden.<br>3. Override toString and equals in Student and test both.<br>4. Print the constructor call order for a three-level hierarchy.<br><b>Check</b>: state three differences between overloading and overriding.",

FN["0_0"]=`<h3>1. How Java works</h3><p>You write source code in a <b>.java</b> file. The compiler <b>javac</b> turns it into <b>bytecode</b> (a <b>.class</b> file). The <b>JVM</b> runs that bytecode on any operating system, which is why Java is called write once, run anywhere.</p><table><tr><th>Term</th><th>What it is</th></tr><tr><td>JVM</td><td>Runs bytecode</td></tr><tr><td>JRE</td><td>JVM + standard libraries (needed to run programs)</td></tr><tr><td>JDK</td><td>JRE + javac + tools (needed to write programs)</td></tr></table>
<h3>2. Setup</h3><ul><li>Install JDK 21 (an LTS version) and IntelliJ IDEA Community or VS Code.</li><li>In a terminal run <b>java -version</b> and <b>javac -version</b>; both must print a version.</li></ul>
<h3>3. Your first program</h3><pre class='cd'>public class Hello {
    public static void main(String[] args) {
        System.out.println("Hello, Java!");
    }
}</pre><ul><li><b>public class Hello</b>: if the class is public, the file must be named Hello.java.</li><li><b>main</b> is where execution starts. <b>static</b> lets the JVM call it without an object; <b>String[] args</b> holds command-line arguments.</li><li><b>System.out.println</b> prints text and moves to a new line.</li><li>Statements end with <b>;</b>. Java is case-sensitive: String is not string.</li></ul><p>Run it: <b>javac Hello.java</b> then <b>java Hello</b>.</p>
<h3>4. Primitive data types</h3><table><tr><th>Type</th><th>Size</th><th>Holds</th></tr><tr><td>byte</td><td>8 bit</td><td>-128 to 127</td></tr><tr><td>short</td><td>16 bit</td><td>-32768 to 32767</td></tr><tr><td>int</td><td>32 bit</td><td>about -2.1 billion to 2.1 billion (default for whole numbers)</td></tr><tr><td>long</td><td>64 bit</td><td>very large whole numbers; write 5L</td></tr><tr><td>float</td><td>32 bit</td><td>decimals; write 2.5f</td></tr><tr><td>double</td><td>64 bit</td><td>decimals (default for decimals)</td></tr><tr><td>char</td><td>16 bit</td><td>one character in single quotes: 'A'</td></tr><tr><td>boolean</td><td>true or false</td><td>conditions</td></tr></table><p>Default values of fields: 0 for numbers, false for boolean, null for objects. Local variables have no default and must be assigned before use. <b>String</b> is not primitive; it is a class and uses double quotes.</p>
<h3>5. Variables and naming</h3><pre class='cd'>int age = 20;
double price = 99.5;
char grade = 'A';
boolean passed = true;
String name = "Asha";
final double PI = 3.14159;   // final = cannot change</pre><ul><li>Names may contain letters, digits, _ and $, cannot start with a digit and cannot be a keyword.</li><li>Convention: variables camelCase, classes PascalCase, constants UPPER_CASE.</li></ul>
<h3>6. Type conversion</h3><pre class='cd'>int i = 10;
double d = i;          // widening, automatic: 10.0
int x = (int) 7.9;     // narrowing, explicit cast: 7 (truncates)
int big = Integer.MAX_VALUE + 1;  // overflow: becomes negative</pre><p>Order of widening: byte, short, int, long, float, double. Narrowing can lose data, so Java forces you to write the cast.</p>
<h3>7. Input and output</h3><pre class='cd'>import java.util.Scanner;

public class Input {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);
        System.out.print("Name: ");
        String name = sc.nextLine();
        System.out.print("Age: ");
        int age = sc.nextInt();
        System.out.printf("%s is %d years old%n", name, age);
        sc.close();
    }
}</pre><ul><li>printf codes: <b>%d</b> int, <b>%.2f</b> decimal with 2 places, <b>%s</b> String, <b>%c</b> char, <b>%n</b> new line.</li><li>nextInt() leaves the Enter key in the buffer. If you call nextLine() after it, you get an empty line; call sc.nextLine() once to clear it first.</li></ul>
<h3>8. Worked solutions to the tasks</h3><pre class='cd'>// Swap two numbers
int a = 5, b = 3;
int t = a; a = b; b = t;       // a=3, b=5

// Simple interest
double p = 1000, r = 5, years = 2;
double si = p * r * years / 100;   // 100.0

// Celsius to Fahrenheit
double c = 37;
double f = c * 9 / 5 + 32;         // 98.6</pre>
<h3>9. Common mistakes</h3><ul><li>Missing semicolon or brace: the compiler error points near the line.</li><li>Class name and file name do not match for a public class.</li><li>Writing 7/2 and expecting 3.5; it is 3 for ints. Use 7/2.0.</li><li>Using == to compare Strings; use equals.</li></ul>`;

FN["0_1"]=`<h3>1. Operators</h3><table><tr><th>Group</th><th>Operators</th></tr><tr><td>Arithmetic</td><td>+ - * / %</td></tr><tr><td>Relational</td><td>== != &lt; &gt; &lt;= &gt;=</td></tr><tr><td>Logical</td><td>&amp;&amp; || !</td></tr><tr><td>Assignment</td><td>= += -= *= /= %=</td></tr><tr><td>Unary</td><td>++ -- + - !</td></tr><tr><td>Bitwise</td><td>&amp; | ^ ~ &lt;&lt; &gt;&gt;</td></tr></table><pre class='cd'>7 / 2      // 3     integer division drops the fraction
7 % 2      // 1     remainder
7 / 2.0    // 3.5   one double makes the result double
-7 % 3     // -1    the sign follows the left number

int a = 5;
int x = a++;   // x = 5, then a = 6  (use, then increase)
int y = ++a;   // a = 7, y = 7       (increase, then use)

5 &amp; 3  // 1   (101 and 011 = 001)
5 | 3  // 7   (111)
5 ^ 3  // 6   (110, bits that differ)
5 &lt;&lt; 1 // 10  (shift left = multiply by 2)
5 &gt;&gt; 1 // 2   (shift right = divide by 2)</pre><p><b>Precedence, high to low:</b> brackets, ++ -- !, * / %, + -, relational, == !=, &amp;&amp;, ||, ternary, assignment. Use brackets when unsure.</p><p><b>Short-circuit:</b> in A &amp;&amp; B, B is skipped if A is false; in A || B, B is skipped if A is true. Example: <b>x != 0 &amp;&amp; 10 / x &gt; 1</b> never divides by zero.</p>
<h3>2. Conditions</h3><pre class='cd'>int marks = 72;
if (marks &gt;= 90) {
    System.out.println("A");
} else if (marks &gt;= 60) {
    System.out.println("B");
} else {
    System.out.println("C");
}

String result = marks &gt;= 40 ? "Pass" : "Fail";   // ternary</pre><ul><li>The condition must be a boolean. <b>if (x = 5)</b> does not compile, because = assigns.</li><li>Compare Strings with <b>equals</b>, never ==.</li><li>Always use braces, even for one line.</li></ul>
<h3>3. switch</h3><pre class='cd'>int day = 3;
switch (day) {
    case 1: System.out.println("Mon"); break;
    case 2: System.out.println("Tue"); break;
    case 3: System.out.println("Wed"); break;
    default: System.out.println("Other");
}

// Java 14+ arrow form, no fall-through
String name = switch (day) {
    case 1 -&gt; "Mon";
    case 2 -&gt; "Tue";
    default -&gt; "Other";
};</pre><ul><li>Without <b>break</b> the old form falls through into the next case.</li><li>switch works on int, char, String and enum, not on long, float or double.</li></ul>
<h3>4. Worked solutions</h3><pre class='cd'>// Leap year
boolean leap = (y % 4 == 0 &amp;&amp; y % 100 != 0) || y % 400 == 0;

// Largest of three
int max = a;
if (b &gt; max) max = b;
if (c &gt; max) max = c;

// Menu calculator
switch (op) {
    case '+': r = a + b; break;
    case '-': r = a - b; break;
    case '*': r = a * b; break;
    case '/': r = (b != 0) ? (double) a / b : 0; break;
}</pre>
<h3>5. Common mistakes</h3><ul><li>Using = instead of ==.</li><li>Forgetting break in a switch.</li><li>Expecting 7/2 to be 3.5.</li><li>Writing a &lt; b &lt; c; Java needs a &lt; b &amp;&amp; b &lt; c.</li></ul>`;

FN["0_2"]=`<h3>1. Why loops</h3><p>A loop repeats a block of code. Use <b>for</b> when you know the count, <b>while</b> when you repeat until a condition changes, and <b>do-while</b> when the body must run at least once (menus, input validation).</p>
<h3>2. The three loops</h3><pre class='cd'>for (int i = 1; i &lt;= 5; i++) {
    System.out.println(i);          // 1 2 3 4 5
}

int n = 5;
while (n &gt; 0) {                    // condition checked FIRST
    System.out.println(n);
    n--;                            // forgetting this = infinite loop
}

int x;
do {
    x = sc.nextInt();               // body runs once, THEN condition is checked
} while (x &lt; 0);</pre><ul><li>A for loop has three parts: <b>init; condition; update</b>. Init runs once, the condition is checked before every round, the update runs after every round.</li><li>for-each (<b>for (int v : arr)</b>) reads every element of an array or collection; you will use it from the Arrays topic onward.</li></ul>
<h3>3. break, continue, labels</h3><pre class='cd'>for (int i = 1; i &lt;= 10; i++) {
    if (i == 3) continue;   // skip 3
    if (i == 6) break;      // stop the loop completely
    System.out.print(i + " ");   // 1 2 4 5
}

outer:
for (int i = 1; i &lt;= 3; i++)
    for (int j = 1; j &lt;= 3; j++) {
        if (i * j == 4) break outer;   // leaves BOTH loops
    }</pre><p>A plain <b>break</b> leaves only the nearest loop. <b>continue</b> jumps to the update step of a for loop.</p>
<h3>4. Digit tricks (very common in tests)</h3><pre class='cd'>int n = 1234, sum = 0, rev = 0;
while (n &gt; 0) {
    int d = n % 10;        // last digit
    sum += d;              // digit sum
    rev = rev * 10 + d;    // reverse number
    n /= 10;               // drop last digit
}
// sum = 10, rev = 4321</pre><p>Palindrome number: keep a copy of the original and compare it with <b>rev</b>. Armstrong number: sum of each digit raised to the number of digits equals the number (153 = 1&sup3; + 5&sup3; + 3&sup3;).</p>
<h3>5. Prime, factorial, Fibonacci</h3><pre class='cd'>// Prime check: only test up to sqrt(n)
boolean prime = n &gt; 1;
for (int i = 2; i * i &lt;= n; i++)
    if (n % i == 0) { prime = false; break; }

// Factorial (use long, 20! is the limit)
long f = 1;
for (int i = 2; i &lt;= n; i++) f *= i;

// Fibonacci: 0 1 1 2 3 5 8 ...
int a = 0, b = 1;
for (int i = 0; i &lt; n; i++) {
    System.out.print(a + " ");
    int next = a + b; a = b; b = next;
}</pre><p><b>Why sqrt(n)?</b> Factors come in pairs (a, b) with a &times; b = n. One of the two is always at most sqrt(n), so if there is no factor up to sqrt(n) there is none at all.</p>
<h3>6. Pattern printing method</h3><p>Outer loop = rows. Inner loop = columns. For each row ask: how many spaces, how many symbols, as a formula of the row number <b>i</b>.</p><pre class='cd'>// Right triangle (n = 4)
for (int i = 1; i &lt;= n; i++) {
    for (int j = 1; j &lt;= i; j++) System.out.print("* ");
    System.out.println();
}
// Pyramid: (n - i) spaces, then (2*i - 1) stars
for (int i = 1; i &lt;= n; i++) {
    for (int s = 1; s &lt;= n - i; s++) System.out.print(" ");
    for (int k = 1; k &lt;= 2 * i - 1; k++) System.out.print("*");
    System.out.println();
}</pre><table><tr><th>Pattern</th><th>Spaces in row i</th><th>Symbols in row i</th></tr><tr><td>Right triangle</td><td>0</td><td>i</td></tr><tr><td>Inverted triangle</td><td>0</td><td>n - i + 1</td></tr><tr><td>Pyramid</td><td>n - i</td><td>2i - 1</td></tr></table>
<h3>7. Trace table (dry run)</h3><p>Before running code, write the variable values after every round. Example: <b>for (i=1; i&lt;=3; i++) sum+=i</b></p><table><tr><th>Round</th><th>i</th><th>sum</th></tr><tr><td>1</td><td>1</td><td>1</td></tr><tr><td>2</td><td>2</td><td>3</td></tr><tr><td>3</td><td>3</td><td>6</td></tr></table>
<h3>8. Common mistakes</h3><ul><li>Off-by-one: using &lt; instead of &lt;= (or the reverse).</li><li>Forgetting the update, giving an infinite loop.</li><li>A semicolon right after the for(...) header: <b>for(...);</b> makes the body empty.</li><li>Using int for factorial and overflowing past 12!.</li></ul>`;

FN["0_3"]=`<h3>1. What is a method</h3><p>A method is a named block of code you can call many times. It gives reuse, readability and easier testing.</p><pre class='cd'>static int add(int a, int b) {     // return type, name, parameters
    return a + b;
}
int r = add(3, 4);                 // call: r = 7</pre><ul><li><b>Parameters</b> are the variables in the definition; <b>arguments</b> are the values you pass in the call.</li><li>A <b>void</b> method returns nothing. Any other return type needs a <b>return</b> on every path.</li><li>Methods that main calls directly are marked <b>static</b> for now; instance methods come with classes.</li></ul>
<h3>2. Pass by value</h3><p>Java <b>always</b> copies the argument.</p><pre class='cd'>static void change(int x) { x = 99; }
int a = 5; change(a);
System.out.println(a);          // still 5

static void rename(StringBuilder sb) { sb.append("!"); }   // changes the object
static void reset(StringBuilder sb)  { sb = new StringBuilder("new"); } // does NOT affect caller</pre><p>For objects, the <b>reference</b> is copied. Both the caller and the method point to the same object, so changing its contents is visible. Pointing the copy somewhere else is not.</p>
<h3>3. Overloading</h3><pre class='cd'>static double area(double r)           { return Math.PI * r * r; }
static double area(double l, double b) { return l * b; }
static double area(int s)              { return s * s; }</pre><ul><li>Same name, <b>different parameter list</b> (type, number or order).</li><li>Changing only the return type is a compile error.</li><li>The compiler picks the method by argument types at compile time, so overloading is <b>compile-time polymorphism</b>.</li></ul>
<h3>4. Scope</h3><pre class='cd'>for (int i = 0; i &lt; 3; i++) { int sq = i * i; }
// i and sq do not exist here: block scope</pre><p>A local variable exists only inside its block and must be assigned before use. A field (declared in the class) lives with the object or class.</p>
<h3>5. Recursion</h3><p>A method that calls itself. It needs a <b>base case</b> (stops) and a <b>smaller problem</b> (moves toward the base case).</p><pre class='cd'>static long fact(int n) {
    if (n &lt;= 1) return 1;          // base case
    return n * fact(n - 1);        // smaller problem
}
// fact(4) = 4 * fact(3) = 4 * 3 * fact(2) = 4 * 3 * 2 * fact(1) = 24</pre><table><tr><th>Call stack for fact(4)</th><th>Waiting for</th></tr><tr><td>fact(4)</td><td>4 * fact(3)</td></tr><tr><td>fact(3)</td><td>3 * fact(2)</td></tr><tr><td>fact(2)</td><td>2 * fact(1)</td></tr><tr><td>fact(1)</td><td>returns 1, then the stack unwinds</td></tr></table><p>No base case or never reaching it gives <b>StackOverflowError</b>. Recursion costs stack memory; a loop is cheaper for simple repetition.</p>
<h3>6. Utility methods to write</h3><pre class='cd'>static boolean isPrime(int n) {
    if (n &lt; 2) return false;
    for (int i = 2; i * i &lt;= n; i++) if (n % i == 0) return false;
    return true;
}
static int gcd(int a, int b) { return b == 0 ? a : gcd(b, a % b); }   // Euclid
static long power(int b, int e) { return e == 0 ? 1 : b * power(b, e - 1); }</pre>
<h3>7. Common mistakes</h3><ul><li>Missing return on one branch: "missing return statement".</li><li>Expecting a swap(int, int) method to swap the caller's variables.</li><li>Two methods differing only in return type.</li><li>Recursion with a base case that is never reached.</li></ul>`;

FN["0_4"]=`<h3>1. Array basics</h3><p>An array stores a fixed number of values of one type in a row of memory. Indexes start at <b>0</b>; the last index is <b>length - 1</b>.</p><pre class='cd'>int[] a = new int[5];            // {0,0,0,0,0}
int[] b = {4, 2, 9, 7};          // length 4
a[0] = 10;
System.out.println(b.length);    // 4   (field, no brackets)
// b[4] throws ArrayIndexOutOfBoundsException</pre><p>Defaults: 0 for numbers, false for boolean, null for objects such as String.</p>
<h3>2. Traversal</h3><pre class='cd'>for (int i = 0; i &lt; b.length; i++) System.out.print(b[i] + " ");
for (int v : b) System.out.print(v + " ");   // read-only style</pre>
<h3>3. Core algorithms</h3><pre class='cd'>// Max and second max in one pass
int max = Integer.MIN_VALUE, second = Integer.MIN_VALUE;
for (int v : b) {
    if (v &gt; max) { second = max; max = v; }
    else if (v &gt; second &amp;&amp; v != max) second = v;
}

// Reverse in place (two pointers)
for (int i = 0, j = b.length - 1; i &lt; j; i++, j--) {
    int t = b[i]; b[i] = b[j]; b[j] = t;
}

// Move zeros to end
int pos = 0;
for (int i = 0; i &lt; b.length; i++) if (b[i] != 0) b[pos++] = b[i];
while (pos &lt; b.length) b[pos++] = 0;</pre><p>Rotate right by k: reverse the whole array, reverse the first k, reverse the rest (use k % n first).</p>
<h3>4. The Arrays class</h3><table><tr><th>Method</th><th>Use</th></tr><tr><td>Arrays.toString(a)</td><td>Readable print of a 1-D array</td></tr><tr><td>Arrays.deepToString(m)</td><td>Readable print of a 2-D array</td></tr><tr><td>Arrays.sort(a)</td><td>Sort in place</td></tr><tr><td>Arrays.fill(a, 7)</td><td>Set every element</td></tr><tr><td>Arrays.copyOf(a, n)</td><td>Copy to a new array of length n</td></tr><tr><td>Arrays.equals(a, b)</td><td>Compare contents</td></tr><tr><td>Arrays.binarySearch(a, k)</td><td>Search a SORTED array</td></tr></table><p><b>b = a</b> copies only the reference; both names then point to the same array. Use <b>a.clone()</b> or <b>Arrays.copyOf</b> for a real copy.</p>
<h3>5. 2-D arrays</h3><pre class='cd'>int[][] m = new int[3][4];                 // 3 rows, 4 columns, 12 cells
int[][] g = {{1,2,3},{4,5,6}};             // 2 x 3
for (int i = 0; i &lt; g.length; i++)         // rows
    for (int j = 0; j &lt; g[i].length; j++)  // columns
        System.out.print(g[i][j] + " ");

// Transpose of a 2 x 3 matrix
int[][] t = new int[3][2];
for (int i = 0; i &lt; 2; i++)
    for (int j = 0; j &lt; 3; j++) t[j][i] = g[i][j];</pre><p>Row sum: add g[i][j] over j. Column sum: add g[i][j] over i. Main diagonal: cells where i == j. A <b>jagged</b> array has rows of different lengths: <b>new int[3][]</b>, then create each row.</p>
<h3>6. Frequency array trick</h3><pre class='cd'>int[] freq = new int[26];
for (char c : "banana".toCharArray()) freq[c - 'a']++;
// freq['a'-'a'] = 3, freq['b'-'a'] = 1, freq['n'-'a'] = 2</pre><p>This counts letters in O(n) with no HashMap; it is the base of the anagram check.</p>
<h3>7. Common mistakes</h3><ul><li>Loop condition <b>i &lt;= a.length</b> causes an out-of-range error.</li><li>Printing an array directly shows something like [I@1b6d3586.</li><li>Using .length() instead of .length for arrays.</li><li>Copying with = and then being surprised that both change.</li></ul>`;

FN["0_5"]=`<h3>1. Strings are immutable</h3><p>A String object never changes. Methods like <b>toUpperCase()</b> return a NEW String. Literals are shared in the <b>string pool</b>.</p><pre class='cd'>String a = "hi", b = "hi";
String c = new String("hi");
a == b          // true  (same pooled object)
a == c          // false (different objects)
a.equals(c)     // true  (same characters)</pre><p>Always compare content with <b>equals</b> (or <b>equalsIgnoreCase</b>); <b>compareTo</b> gives ordering (0 if equal).</p>
<h3>2. Methods to know</h3><table><tr><th>Method</th><th>Example on "Java"</th><th>Result</th></tr><tr><td>length()</td><td>s.length()</td><td>4</td></tr><tr><td>charAt(i)</td><td>s.charAt(1)</td><td>'a'</td></tr><tr><td>substring(b, e)</td><td>s.substring(1,3)</td><td>"av" (end excluded)</td></tr><tr><td>indexOf(x)</td><td>s.indexOf("v")</td><td>2 (-1 if absent)</td></tr><tr><td>replace(a, b)</td><td>s.replace('a','o')</td><td>"Jovo"</td></tr><tr><td>split(",")</td><td>"a,b,c".split(",")</td><td>array of 3</td></tr><tr><td>trim()</td><td>"  x ".trim()</td><td>"x"</td></tr><tr><td>toCharArray()</td><td>s.toCharArray()</td><td>char[]</td></tr></table>
<h3>3. StringBuilder</h3><pre class='cd'>StringBuilder sb = new StringBuilder();
for (int i = 0; i &lt; 5; i++) sb.append(i).append(',');
sb.reverse();  sb.insert(0, "X");  sb.deleteCharAt(sb.length() - 1);
String out = sb.toString();</pre><p>Use it inside loops: each <b>+=</b> on a String creates a new object (O(n&sup2;) overall). StringBuffer is the thread-safe, slower twin.</p>
<h3>4. Worked solutions</h3><pre class='cd'>// Palindrome
boolean pal = new StringBuilder(s).reverse().toString().equals(s);

// Anagram check
char[] x = s1.toCharArray(), y = s2.toCharArray();
Arrays.sort(x); Arrays.sort(y);
boolean ana = Arrays.equals(x, y);

// Vowel count
int v = 0;
for (char ch : s.toLowerCase().toCharArray())
    if ("aeiou".indexOf(ch) != -1) v++;</pre>
<h3>5. Common mistakes</h3><ul><li>Using == for content.</li><li>Ignoring the returned value: <b>s.toUpperCase();</b> alone does nothing.</li><li>substring end index is exclusive.</li><li>charAt out of range throws StringIndexOutOfBoundsException.</li></ul>`;

FN["0_6"]=`<h3>1. Class and object</h3><p>A <b>class</b> is a blueprint (fields + methods). An <b>object</b> is one instance built from it with <b>new</b>; it lives on the heap, and the variable holds a reference.</p><pre class='cd'>class Student {
    int id; String name; double marks;          // fields (state)
    Student(int id, String name, double marks) { // constructor
        this.id = id; this.name = name; this.marks = marks;
    }
    void display() { System.out.println(id + " " + name + " " + marks); }  // behaviour
}
Student s1 = new Student(1, "Asha", 82.5);
s1.display();</pre>
<h3>2. Constructors</h3><ul><li>Same name as the class, no return type.</li><li>If you write none, Java gives a default no-argument one. Write any constructor and the default disappears.</li><li>Overload constructors and chain with <b>this(...)</b> (must be the first line).</li></ul><pre class='cd'>Student() { this(0, "Unknown", 0); }   // chaining</pre>
<h3>3. this</h3><p><b>this</b> is the current object. It separates a field from a same-named parameter (<b>this.name = name</b>) and passes the current object to another method.</p>
<h3>4. static</h3><pre class='cd'>class Counter {
    static int count = 0;       // ONE copy shared by all objects
    Counter() { count++; }
    static int getCount() { return count; }   // no this inside
}
new Counter(); new Counter();
Counter.getCount();   // 2</pre><p>Static members belong to the class and are called as <b>ClassName.member</b>. A static method cannot directly use instance fields. A <b>static block</b> runs once when the class loads.</p>
<h3>5. Initialisation order</h3><table><tr><th>Step</th><th>What runs</th></tr><tr><td>1</td><td>static blocks (once, at class load)</td></tr><tr><td>2</td><td>instance blocks / field initialisers</td></tr><tr><td>3</td><td>constructor body</td></tr></table>
<h3>6. Common mistakes</h3><ul><li>Calling new Student() after writing only a parameterised constructor.</li><li>Writing <b>name = name</b> in a constructor, which assigns the parameter to itself.</li><li>Using an instance field from main without creating an object.</li></ul>`;

FN["0_7"]=`<h3>1. Encapsulation</h3><p>Hide the fields (<b>private</b>) and expose controlled access through public methods. The class then guarantees its own data is always valid.</p><pre class='cd'>class Employee {
    private String name;
    private double salary;
    public double getSalary() { return salary; }
    public void setSalary(double s) {
        if (s &lt; 0) throw new IllegalArgumentException("Salary cannot be negative");
        this.salary = s;
    }
}</pre>
<h3>2. Access modifiers</h3><table><tr><th>Modifier</th><th>Same class</th><th>Same package</th><th>Subclass (other package)</th><th>Everywhere</th></tr><tr><td>private</td><td>Yes</td><td>No</td><td>No</td><td>No</td></tr><tr><td>(default)</td><td>Yes</td><td>Yes</td><td>No</td><td>No</td></tr><tr><td>protected</td><td>Yes</td><td>Yes</td><td>Yes</td><td>No</td></tr><tr><td>public</td><td>Yes</td><td>Yes</td><td>Yes</td><td>Yes</td></tr></table>
<h3>3. Packages</h3><pre class='cd'>package com.bank.model;       // first line of the file
import com.bank.service.AccountService;</pre><p>Packages group related classes and avoid name clashes. Names are lowercase; folder structure matches the package name.</p>
<h3>4. Immutable class</h3><pre class='cd'>public final class Point {
    private final int x, y;
    public Point(int x, int y) { this.x = x; this.y = y; }
    public int getX() { return x; }
    public Point withX(int nx) { return new Point(nx, y); }   // returns a new object
}</pre><p>Final class, private final fields, no setters. Safe to share between threads. String is the classic example.</p>
<h3>5. Common mistakes</h3><ul><li>Public fields that anyone can corrupt.</li><li>Getter returning a mutable array or list directly (callers can change it); return a copy.</li><li>Setter with no validation.</li></ul>`;

FN["0_8"]=`<h3>1. Inheritance</h3><p><b>extends</b> gives a subclass the parent's fields and methods (IS-A). Java classes have <b>single</b> inheritance; every class ultimately extends <b>Object</b>.</p><pre class='cd'>class Vehicle {
    protected String brand;
    Vehicle(String brand) { this.brand = brand; }
    void describe() { System.out.println("Vehicle: " + brand); }
}
class Car extends Vehicle {
    int doors;
    Car(String brand, int doors) { super(brand); this.doors = doors; }  // super first
    @Override void describe() { super.describe(); System.out.println("Doors: " + doors); }
}</pre>
<h3>2. super</h3><ul><li><b>super(...)</b>: calls the parent constructor; must be the first statement.</li><li><b>super.method()</b>: calls the parent's version.</li><li>Constructor order: parent runs first, then child (Grandparent, Parent, Child).</li></ul>
<h3>3. Overriding rules</h3><ul><li>Same name and parameters as the parent method.</li><li>Access may stay the same or widen, never narrow.</li><li>Return type same or a subtype.</li><li>Use <b>@Override</b> so the compiler checks it.</li><li>private, static and final methods cannot be overridden.</li></ul>
<h3>4. Overloading vs overriding</h3><table><tr><th></th><th>Overloading</th><th>Overriding</th></tr><tr><td>Where</td><td>Same class</td><td>Parent and child</td></tr><tr><td>Signature</td><td>Must differ</td><td>Must match</td></tr><tr><td>Resolved</td><td>Compile time</td><td>Runtime</td></tr></table>
<h3>5. Object class and final</h3><p>Override <b>toString()</b> for readable printing, and <b>equals()</b> with <b>hashCode()</b> for content comparison. <b>final</b> on a variable = constant, on a method = no overriding, on a class = no subclasses.</p>
<h3>6. Common mistakes</h3><ul><li>No matching parent constructor: the child must call super(args) explicitly.</li><li>Using inheritance for HAS-A relations; use a field instead (a Car HAS an Engine).</li><li>Overriding equals but not hashCode.</li></ul>`;

FN["0_9"]=`<h3>1. Polymorphism</h3><p>One reference type, many behaviours. <b>Compile-time</b> = overloading. <b>Runtime</b> = overriding: the JVM runs the method of the <b>actual object</b>, not the reference type (dynamic dispatch).</p><pre class='cd'>Shape s = new Circle(2);   // upcasting
s.area();                  // runs Circle's area()
Shape[] all = { new Circle(2), new Square(3) };
for (Shape x : all) System.out.println(x.area());</pre>
<h3>2. Casting</h3><pre class='cd'>Shape s = new Circle(2);
if (s instanceof Circle) {
    Circle c = (Circle) s;   // downcast, checked first
    c.radiusOnlyMethod();
}</pre><p>Upcasting is automatic and safe; through the parent reference only parent members are visible. A wrong downcast throws <b>ClassCastException</b>.</p>
<h3>3. Abstract class</h3><pre class='cd'>abstract class Shape {
    String color;
    abstract double area();            // no body: subclasses must implement
    void show() { System.out.println(color + " " + area()); }   // concrete
}
class Circle extends Shape {
    double r;
    Circle(double r) { this.r = r; }
    double area() { return Math.PI * r * r; }
}</pre><p>Cannot be instantiated; may have fields, constructors and both kinds of methods.</p>
<h3>4. Interface</h3><pre class='cd'>interface Payment {
    void pay(double amount);
    default void receipt() { System.out.println("Paid"); }   // Java 8+
}
class UPI implements Payment { public void pay(double a) { System.out.println("UPI " + a); } }
class Card implements Payment { public void pay(double a) { System.out.println("Card " + a); } }
void checkout(Payment p) { p.pay(500); }     // works for any Payment</pre><p>A class may implement many interfaces. Interface fields are implicitly <b>public static final</b>; methods are public.</p>
<h3>5. Abstract class vs interface</h3><table><tr><th></th><th>Abstract class</th><th>Interface</th></tr><tr><td>Inherit from</td><td>One</td><td>Many</td></tr><tr><td>State (fields)</td><td>Yes</td><td>Constants only</td></tr><tr><td>Constructors</td><td>Yes</td><td>No</td></tr><tr><td>Use for</td><td>Shared code and state (IS-A)</td><td>A capability or contract (CAN-DO)</td></tr></table>
<h3>6. Common mistakes</h3><ul><li>Expecting field access to be polymorphic; only methods are.</li><li>Downcasting without instanceof.</li><li>Forgetting public when implementing an interface method.</li></ul>`;

FN["0_10"]=`<h3>Project: Console ATM</h3><p>This is a two-day build. Day 1 gets a working menu, Day 2 makes it solid and publishable.</p>
<h3>1. Requirements</h3><ul><li>Check balance, deposit, withdraw, change PIN, mini statement, exit.</li><li>PIN check with 3 attempts. Reject negative or non-numeric input without crashing.</li></ul>
<h3>2. Class design</h3><table><tr><th>Class</th><th>Responsibility</th></tr><tr><td>Account</td><td>private balance, pin; deposit(), withdraw(), verifyPin(), history list</td></tr><tr><td>ATM</td><td>menu loop, reads input, calls Account</td></tr><tr><td>Main</td><td>creates an Account and starts the ATM</td></tr></table>
<h3>3. Skeleton</h3><pre class='cd'>class Account {
    private double balance; private int pin;
    private final java.util.List&lt;String&gt; history = new java.util.ArrayList&lt;&gt;();
    Account(int pin, double opening) { this.pin = pin; this.balance = opening; }
    boolean verifyPin(int p) { return p == pin; }
    void deposit(double a) {
        if (a &lt;= 0) throw new IllegalArgumentException("Amount must be positive");
        balance += a; history.add("Deposit " + a);
    }
    void withdraw(double a) {
        if (a &lt;= 0 || a &gt; balance) throw new IllegalArgumentException("Invalid or insufficient");
        balance -= a; history.add("Withdraw " + a);
    }
    double getBalance() { return balance; }
}</pre><pre class='cd'>// Menu loop in ATM
int choice;
do {
    System.out.println("1 Balance  2 Deposit  3 Withdraw  4 Exit");
    choice = Integer.parseInt(sc.nextLine());
    switch (choice) {
        case 1: System.out.println(acc.getBalance()); break;
        case 2: acc.deposit(Double.parseDouble(sc.nextLine())); break;
        case 3: acc.withdraw(Double.parseDouble(sc.nextLine())); break;
    }
} while (choice != 4);</pre><p>Read lines with nextLine and parse them; this avoids the nextInt newline problem. Wrap the body in try/catch for NumberFormatException and IllegalArgumentException.</p>
<h3>4. Day 2 checklist</h3><ul><li>PIN attempts counter in a loop.</li><li>Mini statement: print the last 5 history entries.</li><li>README: what it does, how to compile and run, a sample session.</li><li>Be ready to explain your class design in 2 minutes.</li></ul>`;

FN["1_0"]=`<h3>1. Exception hierarchy</h3><p>Throwable has two branches: <b>Error</b> (JVM problems like OutOfMemoryError; do not catch) and <b>Exception</b>. Under Exception, <b>RuntimeException</b> and its children are <b>unchecked</b>; everything else (IOException, SQLException) is <b>checked</b> and must be caught or declared.</p>
<h3>2. try / catch / finally</h3><pre class='cd'>try {
    int n = Integer.parseInt(text);
    System.out.println(100 / n);
} catch (NumberFormatException e) {
    System.out.println("Not a number");
} catch (ArithmeticException e) {
    System.out.println("Cannot divide by zero");
} finally {
    System.out.println("Always runs");   // even after return
}</pre><ul><li>Order catches from specific to general; a general one first is a compile error.</li><li>Multi-catch: <b>catch (A | B e)</b>.</li></ul>
<h3>3. throw vs throws</h3><pre class='cd'>void withdraw(double a) throws InsufficientBalanceException {   // declares
    if (a &gt; balance) throw new InsufficientBalanceException("Short by " + (a - balance)); // raises
}</pre>
<h3>4. Custom exception</h3><pre class='cd'>class InsufficientBalanceException extends Exception {
    InsufficientBalanceException(String msg) { super(msg); }
}</pre><p>Extend <b>Exception</b> for checked, <b>RuntimeException</b> for unchecked.</p>
<h3>5. try-with-resources</h3><pre class='cd'>try (BufferedReader br = new BufferedReader(new FileReader("a.txt"))) {
    System.out.println(br.readLine());
}   // br.close() called automatically</pre>
<h3>6. Mistakes</h3><ul><li>Empty catch blocks hide bugs; at least log e.getMessage().</li><li>Catching Exception everywhere.</li><li>Putting finally logic that can itself throw.</li></ul>`;

FN["1_1"]=`<h3>1. Collections framework</h3><p>Interfaces: <b>Collection</b> splits into <b>List</b> (ordered, duplicates allowed), <b>Set</b> (unique) and <b>Queue</b>. <b>Map</b> is separate (key to value).</p>
<h3>2. ArrayList vs LinkedList</h3><table><tr><th></th><th>ArrayList</th><th>LinkedList</th></tr><tr><td>Backed by</td><td>Resizable array</td><td>Doubly linked nodes</td></tr><tr><td>get(i)</td><td>O(1)</td><td>O(n)</td></tr><tr><td>Add at end</td><td>O(1) amortised</td><td>O(1)</td></tr><tr><td>Insert/remove middle</td><td>O(n) (shifts)</td><td>O(1) once positioned, O(n) to find</td></tr><tr><td>Memory</td><td>Compact</td><td>Extra pointers per node</td></tr></table><p>Default to ArrayList; LinkedList only for frequent head/tail changes.</p>
<h3>3. Core methods</h3><pre class='cd'>List&lt;String&gt; names = new ArrayList&lt;&gt;();
names.add("Asha"); names.add(0, "Ravi");
names.get(1); names.set(1, "Meera"); names.remove("Ravi");
names.contains("Asha"); names.size(); names.isEmpty();
Collections.sort(names); Collections.reverse(names);
List&lt;Integer&gt; nums = new ArrayList&lt;&gt;(List.of(5, 1, 7));
nums.remove(1);                    // by INDEX: removes the element at 1
nums.remove(Integer.valueOf(7));   // by VALUE</pre>
<h3>4. Iterating</h3><pre class='cd'>for (String s : names) System.out.println(s);
Iterator&lt;String&gt; it = names.iterator();
while (it.hasNext()) if (it.next().startsWith("A")) it.remove();   // safe removal</pre>
<h3>5. Worked tasks</h3><pre class='cd'>// Remove duplicates, keep order
List&lt;Integer&gt; u = new ArrayList&lt;&gt;(new LinkedHashSet&lt;&gt;(nums));
// Merge two sorted lists
int i = 0, j = 0; List&lt;Integer&gt; m = new ArrayList&lt;&gt;();
while (i &lt; a.size() &amp;&amp; j &lt; b.size()) m.add(a.get(i) &lt;= b.get(j) ? a.get(i++) : b.get(j++));
while (i &lt; a.size()) m.add(a.get(i++));
while (j &lt; b.size()) m.add(b.get(j++));</pre>
<h3>6. Mistakes</h3><ul><li>remove(int) vs remove(Object) on List of Integer.</li><li>Removing in a for-each loop: ConcurrentModificationException.</li><li>List.of(...) is immutable; add() throws UnsupportedOperationException.</li></ul>`;

FN["1_2"]=`<h3>1. How HashMap works</h3><p>For put(key, value): compute <b>key.hashCode()</b>, pick a bucket, and inside the bucket use <b>equals</b> to find or add the entry. Average get/put is O(1). Two keys in one bucket is a <b>collision</b>; Java handles it with a list (and a tree when long). When size passes <b>0.75 &times; capacity</b> (load factor), the table doubles and rehashes.</p>
<h3>2. The Map family</h3><table><tr><th>Type</th><th>Order</th><th>get/put</th><th>Null key</th></tr><tr><td>HashMap</td><td>None</td><td>O(1)</td><td>One allowed</td></tr><tr><td>LinkedHashMap</td><td>Insertion</td><td>O(1)</td><td>One allowed</td></tr><tr><td>TreeMap</td><td>Sorted by key</td><td>O(log n)</td><td>Not allowed</td></tr></table><p><b>HashSet</b> is a HashMap with only keys: unique, unordered. Same idea for LinkedHashSet and TreeSet.</p>
<h3>3. Methods</h3><pre class='cd'>Map&lt;String, Integer&gt; m = new HashMap&lt;&gt;();
m.put("a", 1);  m.get("a");  m.getOrDefault("z", 0);
m.containsKey("a");  m.remove("a");  m.putIfAbsent("b", 2);
m.merge("a", 1, Integer::sum);          // count in one line
for (Map.Entry&lt;String, Integer&gt; e : m.entrySet())
    System.out.println(e.getKey() + "=" + e.getValue());</pre>
<h3>4. Worked tasks</h3><pre class='cd'>// Word frequency
for (String w : text.split(" ")) freq.merge(w, 1, Integer::sum);
// First non-repeating character
Map&lt;Character,Integer&gt; c = new LinkedHashMap&lt;&gt;();
for (char ch : s.toCharArray()) c.merge(ch, 1, Integer::sum);
for (var e : c.entrySet()) if (e.getValue() == 1) { System.out.println(e.getKey()); break; }
// Two Sum
Map&lt;Integer,Integer&gt; seen = new HashMap&lt;&gt;();
for (int i = 0; i &lt; a.length; i++) {
    if (seen.containsKey(target - a[i])) return new int[]{seen.get(target - a[i]), i};
    seen.put(a[i], i);
}</pre>
<h3>5. equals and hashCode contract</h3><p>If a.equals(b) then a.hashCode() == b.hashCode(). Override both together or lookups fail. Never mutate a field used in hashCode after using the object as a key.</p>`;

FN["1_3"]=`<h3>1. Generics</h3><p>Generics give compile-time type safety and remove casts.</p><pre class='cd'>class Pair&lt;K, V&gt; {
    private K key; private V value;
    Pair(K k, V v) { key = k; value = v; }
    K getKey() { return key; }  V getValue() { return value; }
}
Pair&lt;String,Integer&gt; p = new Pair&lt;&gt;("age", 20);

static &lt;T extends Comparable&lt;T&gt;&gt; T max(T a, T b) { return a.compareTo(b) &gt; 0 ? a : b; }</pre><ul><li>Only object types: <b>List&lt;Integer&gt;</b>, not List&lt;int&gt;.</li><li>Type erasure: generics vanish at runtime, so no <b>new T()</b>.</li><li>Bounded type <b>T extends Number</b>; wildcard <b>List&lt;? extends Number&gt;</b> for read-only use.</li></ul>
<h3>2. Iterator</h3><p><b>hasNext()</b>, <b>next()</b>, <b>remove()</b>. Changing the list during for-each throws ConcurrentModificationException; use iterator.remove() or removeIf.</p>
<h3>3. Comparable vs Comparator</h3><table><tr><th></th><th>Comparable</th><th>Comparator</th></tr><tr><td>Method</td><td>compareTo(other)</td><td>compare(a, b)</td></tr><tr><td>Where</td><td>Inside the class (natural order)</td><td>Outside (any custom order)</td></tr><tr><td>Orders</td><td>One</td><td>Many</td></tr></table><pre class='cd'>class Student implements Comparable&lt;Student&gt; {
    int marks; String name;
    public int compareTo(Student o) { return Integer.compare(marks, o.marks); }
}
list.sort(Comparator.comparing(Employee::getSalary).reversed()
        .thenComparing(Employee::getName));</pre><p>compare returns negative if first is smaller, 0 if equal, positive if larger. Use Integer.compare, not subtraction (overflow risk).</p>`;

FN["1_4"]=`<h3>1. Lambdas</h3><p>A lambda is a short anonymous function for a <b>functional interface</b> (exactly one abstract method).</p><pre class='cd'>Runnable r = () -&gt; System.out.println("run");
Comparator&lt;String&gt; c = (a, b) -&gt; a.length() - b.length();
Function&lt;Integer,Integer&gt; sq = x -&gt; x * x;
Predicate&lt;Integer&gt; even = x -&gt; x % 2 == 0;
list.forEach(System.out::println);      // method reference</pre><p>Common interfaces: Function (T to R), Predicate (T to boolean), Consumer (T to nothing), Supplier (nothing to T).</p>
<h3>2. Stream pipeline</h3><p><b>Source</b> to <b>intermediate</b> operations (lazy) to one <b>terminal</b> operation (runs it).</p><pre class='cd'>List&lt;String&gt; out = names.stream()
    .filter(n -&gt; n.length() &gt; 3)
    .map(String::toUpperCase)
    .sorted()
    .distinct()
    .collect(Collectors.toList());
int total = nums.stream().mapToInt(Integer::intValue).sum();
long c = nums.stream().filter(x -&gt; x &gt; 5).count();
int prod = nums.stream().reduce(1, (a, b) -&gt; a * b);</pre>
<h3>3. Collectors</h3><pre class='cd'>Map&lt;String, List&lt;Txn&gt;&gt; byType = txns.stream().collect(Collectors.groupingBy(Txn::getType));
Map&lt;String, Double&gt; sumByType = txns.stream()
    .collect(Collectors.groupingBy(Txn::getType, Collectors.summingDouble(Txn::getAmount)));
String joined = names.stream().collect(Collectors.joining(", "));</pre>
<h3>4. Optional</h3><pre class='cd'>Optional&lt;Employee&gt; top = emps.stream().max(Comparator.comparingDouble(Employee::getSalary));
top.ifPresent(e -&gt; System.out.println(e.getName()));
String n = Optional.ofNullable(name).orElse("Unknown");</pre>
<h3>5. Mistakes</h3><ul><li>A stream can be used only once.</li><li>Intermediate operations do nothing without a terminal one.</li><li>Changing outside variables inside a lambda (they must be effectively final).</li></ul>`;

FN["1_6"]=`<h3>1. Creating threads</h3><pre class='cd'>class Task implements Runnable {
    public void run() { System.out.println(Thread.currentThread().getName()); }
}
Thread t = new Thread(new Task());
t.start();      // creates a NEW thread
// t.run();     // just a normal call on the current thread
t.join();       // wait for it to finish
Thread t2 = new Thread(() -&gt; System.out.println("lambda"));</pre><p>Prefer Runnable over extending Thread (a class can extend only one parent).</p>
<h3>2. Lifecycle</h3><table><tr><th>State</th><th>Meaning</th></tr><tr><td>NEW</td><td>Created, not started</td></tr><tr><td>RUNNABLE</td><td>Ready or running</td></tr><tr><td>BLOCKED / WAITING</td><td>Waiting for a lock or signal</td></tr><tr><td>TERMINATED</td><td>Finished</td></tr></table>
<h3>3. Race condition and synchronized</h3><pre class='cd'>class Counter {
    private int c = 0;
    synchronized void inc() { c++; }   // one thread at a time
    int get() { return c; }
}</pre><p><b>c++</b> is read, add, write: three steps, so two threads can lose updates. With 2 threads &times; 1000 increments, unsynchronised code often prints less than 2000.</p>
<h3>4. ExecutorService</h3><pre class='cd'>ExecutorService ex = Executors.newFixedThreadPool(3);
for (int i = 0; i &lt; 5; i++) ex.submit(() -&gt; System.out.println("task on " + Thread.currentThread().getName()));
ex.shutdown();
ex.awaitTermination(5, TimeUnit.SECONDS);</pre>
<h3>5. Deadlock</h3><p>Thread A holds lock 1 and waits for lock 2, thread B holds lock 2 and waits for lock 1. Avoid it by always taking locks in the same order. Also know <b>volatile</b> (visibility of one variable) and <b>AtomicInteger</b> (lock-free counter).</p>`;

FN["1_7"]=`<h3>1. JDBC flow</h3><p>Add the driver jar (MySQL or PostgreSQL) to the project. Then: connect, create statement, execute, read results, close.</p><pre class='cd'>String url = "jdbc:mysql://localhost:3306/bank";
try (Connection con = DriverManager.getConnection(url, "root", "password");
     PreparedStatement ps = con.prepareStatement("SELECT id, name FROM students WHERE name = ?")) {
    ps.setString(1, "Asha");
    try (ResultSet rs = ps.executeQuery()) {
        while (rs.next()) System.out.println(rs.getInt("id") + " " + rs.getString("name"));
    }
} catch (SQLException e) { e.printStackTrace(); }</pre>
<h3>2. CRUD</h3><pre class='cd'>// INSERT / UPDATE / DELETE use executeUpdate (returns rows affected)
PreparedStatement ins = con.prepareStatement("INSERT INTO students(name, marks) VALUES(?, ?)");
ins.setString(1, "Ravi"); ins.setDouble(2, 88.5);
int rows = ins.executeUpdate();</pre>
<h3>3. SQL injection</h3><p>Bad: <b>"SELECT * FROM users WHERE name='" + input + "'"</b>. Input like <b>' OR '1'='1</b> returns every row. A PreparedStatement sends the SQL and the values separately, so input is always treated as data.</p>
<h3>4. Transactions</h3><pre class='cd'>con.setAutoCommit(false);
try { debit.executeUpdate(); credit.executeUpdate(); con.commit(); }
catch (SQLException e) { con.rollback(); }</pre><h3>5. Mistakes</h3><ul><li>Never hard-code real passwords in code you push to GitHub.</li><li>Forgetting that executeQuery is for SELECT only.</li><li>Not closing Connection, Statement and ResultSet.</li></ul>`;

FN["1_8"]=`<h3>1. SOLID</h3><table><tr><th>Letter</th><th>Rule</th><th>Quick example</th></tr><tr><td>S</td><td>A class has one reason to change</td><td>Split Invoice (data) from InvoicePrinter</td></tr><tr><td>O</td><td>Open for extension, closed for modification</td><td>Add a new Payment class, do not edit a giant if-else</td></tr><tr><td>L</td><td>Subclasses must work wherever the parent is used</td><td>A Square that breaks Rectangle's setWidth behaviour violates it</td></tr><tr><td>I</td><td>Many small interfaces beat one fat one</td><td>Printer and Scanner, not one MultiFunction for all</td></tr><tr><td>D</td><td>Depend on abstractions, not concrete classes</td><td>Service takes a Payment interface, not UPI directly</td></tr></table>
<h3>2. Design patterns</h3><pre class='cd'>// Singleton (one instance)
class Config {
    private static final Config INSTANCE = new Config();
    private Config() {}
    static Config get() { return INSTANCE; }
}
// Strategy (swap algorithm at runtime)
interface PayStrategy { void pay(double a); }
class Checkout { PayStrategy s; Checkout(PayStrategy s) { this.s = s; } void run() { s.pay(500); } }
new Checkout(new UpiPay()).run();
// Factory (create without exposing the class)
static Shape create(String t) { return t.equals("circle") ? new Circle() : new Square(); }</pre><table><tr><th>Pattern</th><th>Use when</th></tr><tr><td>Builder</td><td>Many optional constructor fields</td></tr><tr><td>Observer</td><td>Notify many listeners (balance alerts)</td></tr></table><p>Prefer composition (HAS-A) over inheritance. Do not force patterns where simple code works.</p>`;

<h3>3. .gitignore</h3><pre class='cd'>*.class

FN["1_10"]=`<h3>Project: Banking Management System (Day 1: design and core)</h3>
<h3>1. Schema</h3><pre class='cd'>CREATE TABLE customers (id INT PRIMARY KEY AUTO_INCREMENT, name VARCHAR(50), phone VARCHAR(15));
CREATE TABLE accounts  (acc_no INT PRIMARY KEY AUTO_INCREMENT, customer_id INT, balance DECIMAL(12,2) DEFAULT 0,
                        FOREIGN KEY (customer_id) REFERENCES customers(id));
CREATE TABLE transactions (id INT PRIMARY KEY AUTO_INCREMENT, acc_no INT, type VARCHAR(10), amount DECIMAL(12,2),
                        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP, FOREIGN KEY (acc_no) REFERENCES accounts(acc_no));</pre>
<h3>2. Layers</h3><table><tr><th>Layer</th><th>Classes</th></tr><tr><td>model</td><td>Customer, Account, Transaction</td></tr><tr><td>dao</td><td>AccountDao (JDBC only)</td></tr><tr><td>service</td><td>BankService (rules, exceptions)</td></tr><tr><td>app</td><td>Main console menu</td></tr></table>
<h3>3. Transfer in one transaction</h3><pre class='cd'>con.setAutoCommit(false);
try {
    if (balance(from) &lt; amt) throw new InsufficientBalanceException("Low balance");
    update(from, -amt); update(to, +amt);
    log(from, "DEBIT", amt); log(to, "CREDIT", amt);
    con.commit();
} catch (Exception e) { con.rollback(); throw e; }</pre><p>Both updates succeed or neither does: that is atomicity (the A in ACID).</p>
<h3>4. Day 1 goal</h3><ul><li>Schema created, project compiles.</li><li>Create account, deposit and withdraw work through JDBC.</li></ul>`;

/* PACK M3-LESSONS: Month 3 (SQL + DBMS) full lessons. Sample tables used throughout:
   employees(id, name, dept, salary, manager_id)  customers(id, name, city)  orders(id, customer_id, amount, order_date) */

FN["2_0"]=`<h3>1. Query order of writing</h3><pre class='cd'>SELECT   name, salary
FROM     employees
WHERE    dept = 'IT' AND salary &gt;= 50000
ORDER BY salary DESC
LIMIT    5;</pre><p>SQL runs it in a different order: <b>FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY, LIMIT</b>. That is why you cannot use a SELECT alias inside WHERE.</p>
<h3>2. Filters</h3><table><tr><th>Operator</th><th>Example</th></tr><tr><td>AND / OR / NOT</td><td>dept='IT' OR dept='HR'</td></tr><tr><td>IN</td><td>dept IN ('IT','HR')</td></tr><tr><td>BETWEEN (inclusive)</td><td>salary BETWEEN 40000 AND 60000</td></tr><tr><td>LIKE</td><td>name LIKE 'A%' (starts with A), '%a' (ends), '_s%' (2nd letter s)</td></tr><tr><td>IS NULL</td><td>manager_id IS NULL (never = NULL)</td></tr></table>
<h3>3. DISTINCT, ORDER BY, LIMIT</h3><pre class='cd'>SELECT DISTINCT dept FROM employees;
SELECT * FROM employees ORDER BY dept ASC, salary DESC;
SELECT * FROM employees ORDER BY salary DESC LIMIT 3 OFFSET 2;   -- rows 3 to 5</pre><p>SQL Server uses <b>TOP 3</b>; Oracle uses <b>FETCH FIRST 3 ROWS ONLY</b>.</p>
<h3>4. Mistakes</h3><ul><li>Writing <b>= NULL</b> instead of <b>IS NULL</b>.</li><li>Mixing AND and OR without brackets.</li><li>SELECT * in real queries; name the columns you need.</li></ul>`;

FN["2_1"]=`<h3>1. Aggregate functions</h3><pre class='cd'>SELECT COUNT(*), COUNT(manager_id), SUM(salary), AVG(salary), MIN(salary), MAX(salary) FROM employees;</pre><p><b>COUNT(*)</b> counts rows; <b>COUNT(col)</b> skips NULLs. Aggregates ignore NULLs (except COUNT(*)).</p>
<h3>2. GROUP BY</h3><pre class='cd'>SELECT dept, COUNT(*) AS headcount, AVG(salary) AS avg_sal
FROM employees
GROUP BY dept;</pre><p>Every non-aggregated column in SELECT must appear in GROUP BY.</p>
<h3>3. WHERE vs HAVING</h3><table><tr><th>WHERE</th><th>HAVING</th></tr><tr><td>Filters rows before grouping</td><td>Filters groups after aggregation</td></tr><tr><td>Cannot use aggregates</td><td>Can use aggregates</td></tr></table><pre class='cd'>SELECT customer_id, COUNT(*) AS n
FROM orders
WHERE order_date &gt;= '2026-01-01'      -- row filter
GROUP BY customer_id
HAVING COUNT(*) &gt;= 3;                 -- group filter</pre>
<h3>4. Practice answers</h3><pre class='cd'>-- Sales per city
SELECT c.city, SUM(o.amount) FROM orders o JOIN customers c ON c.id=o.customer_id GROUP BY c.city;
-- Departments with average salary above 60000
SELECT dept FROM employees GROUP BY dept HAVING AVG(salary) &gt; 60000;</pre>`;

FN["2_2"]=`<h3>1. CASE WHEN</h3><pre class='cd'>SELECT name, marks,
  CASE WHEN marks &gt;= 90 THEN 'A'
       WHEN marks &gt;= 75 THEN 'B'
       WHEN marks &gt;= 60 THEN 'C'
       ELSE 'F' END AS grade
FROM students;</pre><p>First matching branch wins. Also useful inside aggregates: <b>SUM(CASE WHEN status='paid' THEN amount ELSE 0 END)</b>.</p>
<h3>2. NULL handling</h3><ul><li>Any comparison with NULL is unknown, so use <b>IS NULL</b> / <b>IS NOT NULL</b>.</li><li><b>COALESCE(price, 0)</b> returns the first non-NULL value.</li><li>NULL + 5 = NULL. COUNT(col) skips NULLs. NOT IN with a NULL in the list returns no rows (a classic trap); prefer NOT EXISTS.</li></ul>
<h3>3. String and date functions (MySQL names; others are similar)</h3><table><tr><th>Need</th><th>Function</th></tr><tr><td>Length, case</td><td>LENGTH(s), UPPER(s), LOWER(s)</td></tr><tr><td>Join text</td><td>CONCAT(a, ' ', b)</td></tr><tr><td>Cut text</td><td>SUBSTRING(s, 1, 3), TRIM(s), REPLACE(s, 'a', 'b')</td></tr><tr><td>Year / month</td><td>YEAR(d), MONTH(d), DATE_FORMAT(d, '%Y-%m')</td></tr><tr><td>Difference</td><td>DATEDIFF(d1, d2), DATE_ADD(d, INTERVAL 7 DAY)</td></tr></table><pre class='cd'>SELECT YEAR(order_date) y, MONTH(order_date) m, SUM(amount) FROM orders GROUP BY y, m;</pre>`;

FN["2_3"]=`<h3>1. Join types</h3><table><tr><th>Join</th><th>Returns</th></tr><tr><td>INNER</td><td>Only rows that match in both tables</td></tr><tr><td>LEFT</td><td>All left rows; right columns NULL if no match</td></tr><tr><td>RIGHT</td><td>All right rows; left columns NULL if no match</td></tr><tr><td>FULL</td><td>All rows from both (not in MySQL; use LEFT UNION RIGHT)</td></tr><tr><td>CROSS</td><td>Every combination (m x n rows)</td></tr><tr><td>SELF</td><td>A table joined to itself using aliases</td></tr></table>
<h3>2. Examples</h3><pre class='cd'>-- Customers with their orders
SELECT c.name, o.amount FROM customers c INNER JOIN orders o ON o.customer_id = c.id;

-- Customers who never ordered (LEFT JOIN + IS NULL)
SELECT c.name FROM customers c LEFT JOIN orders o ON o.customer_id = c.id WHERE o.id IS NULL;

-- Employee and manager (self join)
SELECT e.name AS employee, m.name AS manager
FROM employees e LEFT JOIN employees m ON e.manager_id = m.id;

-- Three tables
SELECT c.name, p.title FROM orders o
JOIN customers c ON c.id = o.customer_id
JOIN products  p ON p.id = o.product_id;</pre>
<h3>3. Rules</h3><ul><li>Always write the ON condition; forgetting it creates a cross join.</li><li>A WHERE filter on the right table of a LEFT JOIN turns it into an inner join; put such conditions in ON.</li><li>Draw two overlapping circles and shade the result before writing any join.</li></ul>`;

FN["2_4"]=`<h3>1. Subquery kinds</h3><pre class='cd'>-- Scalar: returns one value
SELECT name FROM employees WHERE salary &gt; (SELECT AVG(salary) FROM employees);

-- List: used with IN
SELECT name FROM customers WHERE id IN (SELECT customer_id FROM orders WHERE amount &gt; 1000);

-- Correlated: refers to the outer row; runs per outer row
SELECT e.name FROM employees e
WHERE e.salary &gt; (SELECT AVG(salary) FROM employees WHERE dept = e.dept);

-- Derived table (in FROM, needs an alias)
SELECT d.dept, d.avg_sal FROM (SELECT dept, AVG(salary) avg_sal FROM employees GROUP BY dept) d WHERE d.avg_sal &gt; 60000;</pre>
<h3>2. IN vs EXISTS</h3><table><tr><th>IN</th><th>EXISTS</th></tr><tr><td>Compares against a list of values</td><td>Checks whether any row exists</td></tr><tr><td>NOT IN breaks if the list has NULL</td><td>NOT EXISTS handles NULLs safely</td></tr></table><pre class='cd'>SELECT c.name FROM customers c
WHERE NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id);</pre><h3>3. Tip</h3><p>Many correlated subqueries can be rewritten as joins or window functions and are faster. Start with the subquery for clarity, then optimise.</p>`;

FN["2_5"]=`<h3>1. CTE basics</h3><p>A Common Table Expression is a named temporary result for one query. It makes long SQL readable.</p><pre class='cd'>WITH dept_avg AS (
    SELECT dept, AVG(salary) AS avg_sal FROM employees GROUP BY dept
)
SELECT e.name, e.salary, d.avg_sal
FROM employees e JOIN dept_avg d ON d.dept = e.dept
WHERE e.salary &gt; d.avg_sal;</pre>
<h3>2. Multiple CTEs</h3><pre class='cd'>WITH big AS (SELECT * FROM orders WHERE amount &gt; 1000),
     per_cust AS (SELECT customer_id, COUNT(*) n FROM big GROUP BY customer_id)
SELECT * FROM per_cust WHERE n &gt;= 2;</pre><p>Later CTEs can use earlier ones. Separate them with commas; only one WITH keyword.</p>
<h3>3. Recursive CTE (org chart)</h3><pre class='cd'>WITH RECURSIVE chain AS (
    SELECT id, name, manager_id, 1 AS lvl FROM employees WHERE manager_id IS NULL   -- anchor
    UNION ALL
    SELECT e.id, e.name, e.manager_id, c.lvl + 1
    FROM employees e JOIN chain c ON e.manager_id = c.id                            -- recursive step
)
SELECT * FROM chain ORDER BY lvl;</pre><p>Anchor query starts it, the recursive part repeats until no new rows appear.</p>`;

FN["2_6"]=`<h3>1. Window function shape</h3><p>A window function calculates over related rows <b>without collapsing them</b> (unlike GROUP BY).</p><pre class='cd'>function() OVER (PARTITION BY dept ORDER BY salary DESC)</pre>
<h3>2. Ranking</h3><table><tr><th>Salary</th><th>ROW_NUMBER</th><th>RANK</th><th>DENSE_RANK</th></tr><tr><td>90</td><td>1</td><td>1</td><td>1</td></tr><tr><td>90</td><td>2</td><td>1</td><td>1</td></tr><tr><td>80</td><td>3</td><td>3</td><td>2</td></tr></table><p>ROW_NUMBER never ties; RANK ties and skips; DENSE_RANK ties without skipping.</p><pre class='cd'>-- Top 3 salaries per department
SELECT * FROM (
  SELECT name, dept, salary, DENSE_RANK() OVER (PARTITION BY dept ORDER BY salary DESC) rk FROM employees
) t WHERE rk &lt;= 3;</pre>
<h3>3. LAG, LEAD, running total</h3><pre class='cd'>SELECT month, revenue,
  LAG(revenue)  OVER (ORDER BY month) AS prev_month,
  revenue - LAG(revenue) OVER (ORDER BY month) AS change,
  SUM(revenue)  OVER (ORDER BY month) AS running_total
FROM monthly_sales;</pre><p>You cannot filter on a window function in WHERE; wrap the query in a subquery or CTE first.</p>`;

FN["2_7"]=`<h3>1. Keys</h3><table><tr><th>Key</th><th>Meaning</th></tr><tr><td>Super key</td><td>Any set of columns that uniquely identifies a row</td></tr><tr><td>Candidate key</td><td>A minimal super key (no extra column)</td></tr><tr><td>Primary key</td><td>The chosen candidate key; unique and NOT NULL</td></tr><tr><td>Alternate key</td><td>A candidate key not chosen as primary</td></tr><tr><td>Foreign key</td><td>A column referencing another table's key</td></tr><tr><td>Composite key</td><td>A key made of several columns</td></tr></table>
<h3>2. Constraints</h3><pre class='cd'>CREATE TABLE students (
  id INT PRIMARY KEY,
  email VARCHAR(80) UNIQUE NOT NULL,
  age INT CHECK (age &gt;= 16),
  dept_id INT DEFAULT 1,
  FOREIGN KEY (dept_id) REFERENCES departments(id) ON DELETE CASCADE
);</pre>
<h3>3. ER diagrams</h3><ul><li><b>Entity</b> = rectangle (Student), <b>attribute</b> = oval, <b>relationship</b> = diamond (Enrolls).</li><li>Cardinality: 1:1, 1:N (Customer has many Orders), M:N (Student and Course).</li><li>An M:N relationship becomes a <b>junction table</b> with two foreign keys: enrollments(student_id, course_id).</li></ul>`;

FN["2_8"]=`<h3>1. Why normalise</h3><p>Normalisation removes redundancy and three anomalies: <b>insert</b> (cannot add data without other data), <b>update</b> (change in many rows), <b>delete</b> (losing unrelated facts).</p>
<h3>2. Normal forms</h3><table><tr><th>Form</th><th>Rule</th><th>Fix</th></tr><tr><td>1NF</td><td>Atomic values, no repeating groups</td><td>Split "phones: 1,2" into rows</td></tr><tr><td>2NF</td><td>1NF + no partial dependency on part of a composite key</td><td>Move attributes that depend on one key part to their own table</td></tr><tr><td>3NF</td><td>2NF + no transitive dependency (non-key depends on non-key)</td><td>Move city-to-state style facts out</td></tr><tr><td>BCNF</td><td>Every determinant is a candidate key</td><td>Split where a non-key determines part of a key</td></tr></table>
<h3>3. Worked example</h3><p>Orders(order_id, product_id, product_name, customer_id, customer_city). product_name depends only on product_id (partial) and customer_city only on customer_id.</p><pre class='cd'>Orders(order_id, product_id, customer_id)
Products(product_id, product_name)
Customers(customer_id, customer_city)</pre><p><b>Functional dependency</b> A to B means A determines B. Denormalise on purpose only for read-heavy reporting.</p>`;

FN["2_9"]=`<h3>1. ACID</h3><table><tr><th>Letter</th><th>Meaning</th><th>Bank example</th></tr><tr><td>Atomicity</td><td>All or nothing</td><td>Debit and credit both happen or neither</td></tr><tr><td>Consistency</td><td>Rules always hold</td><td>Total money unchanged</td></tr><tr><td>Isolation</td><td>Concurrent transactions do not interfere</td><td>Two withdrawals do not corrupt balance</td></tr><tr><td>Durability</td><td>Committed data survives a crash</td><td>Saved to disk or log</td></tr></table>
<h3>2. Transaction commands</h3><pre class='cd'>START TRANSACTION;
UPDATE accounts SET balance = balance - 500 WHERE id = 1;
UPDATE accounts SET balance = balance + 500 WHERE id = 2;
COMMIT;      -- or ROLLBACK; to undo</pre>
<h3>3. Concurrency problems</h3><table><tr><th>Problem</th><th>Meaning</th></tr><tr><td>Dirty read</td><td>Reading uncommitted data</td></tr><tr><td>Non-repeatable read</td><td>Same row read twice, different value</td></tr><tr><td>Phantom read</td><td>Same query returns new rows</td></tr></table><table><tr><th>Isolation level</th><th>Prevents</th></tr><tr><td>Read Uncommitted</td><td>Nothing</td></tr><tr><td>Read Committed</td><td>Dirty reads</td></tr><tr><td>Repeatable Read</td><td>Dirty + non-repeatable</td></tr><tr><td>Serializable</td><td>All three (slowest)</td></tr></table><p><b>Deadlock:</b> two transactions each wait for the other's lock; the DB aborts one.</p>`;

FN["2_10"]=`<h3>1. Indexes</h3><p>An index is a sorted structure (usually a <b>B-tree</b>) that lets the database find rows without scanning the whole table.</p><pre class='cd'>CREATE INDEX idx_emp_dept ON employees(dept);
CREATE INDEX idx_orders_cust_date ON orders(customer_id, order_date);   -- composite
EXPLAIN SELECT * FROM employees WHERE dept = 'IT';</pre><table><tr><th>Clustered</th><th>Non-clustered</th></tr><tr><td>Defines physical row order; one per table (often the primary key)</td><td>Separate structure pointing to rows; many allowed</td></tr></table><ul><li>Helps WHERE, JOIN, ORDER BY on the indexed column.</li><li>Costs storage and slows INSERT/UPDATE/DELETE.</li><li>A function on the column (<b>WHERE YEAR(d)=2026</b>) or a leading wildcard (<b>LIKE '%x'</b>) prevents index use.</li><li>Composite index follows the leftmost-prefix rule.</li></ul>
<h3>2. Views</h3><pre class='cd'>CREATE VIEW it_staff AS SELECT id, name, salary FROM employees WHERE dept = 'IT';
SELECT * FROM it_staff;</pre><p>A view is a saved query: simplifies access and hides columns. It stores no data (unless materialised).</p>
<h3>3. Procedures and triggers</h3><ul><li><b>Stored procedure:</b> saved SQL you CALL with parameters.</li><li><b>Trigger:</b> runs automatically on INSERT, UPDATE or DELETE (for example, write an audit row).</li></ul>`;

FN["2_11"]=`<h3>Classic SQL interview set</h3>
<h3>1. Nth highest salary</h3><pre class='cd'>SELECT DISTINCT salary FROM (
  SELECT salary, DENSE_RANK() OVER (ORDER BY salary DESC) rk FROM employees
) t WHERE rk = 3;</pre>
<h3>2. Find duplicates</h3><pre class='cd'>SELECT email, COUNT(*) FROM users GROUP BY email HAVING COUNT(*) &gt; 1;</pre>
<h3>3. Employees earning more than their manager</h3><pre class='cd'>SELECT e.name FROM employees e JOIN employees m ON e.manager_id = m.id WHERE e.salary &gt; m.salary;</pre>
<h3>4. Top N per group</h3><pre class='cd'>SELECT * FROM (SELECT *, ROW_NUMBER() OVER (PARTITION BY dept ORDER BY salary DESC) rn FROM employees) t WHERE rn &lt;= 2;</pre>
<h3>5. Consecutive-day logins</h3><pre class='cd'>SELECT DISTINCT user_id FROM (
  SELECT user_id, login_date,
         DATE_SUB(login_date, INTERVAL ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY login_date) DAY) AS grp
  FROM (SELECT DISTINCT user_id, login_date FROM logins) x
) y GROUP BY user_id, grp HAVING COUNT(*) &gt;= 3;</pre><p>Idea: subtracting the row number from the date gives the same value for a run of consecutive days.</p>
<h3>6. Method for any SQL question</h3><ul><li>State the output columns and the grain (one row per what?).</li><li>Choose the tables and the join keys.</li><li>Filter (WHERE), group (GROUP BY), filter groups (HAVING), then rank or limit.</li><li>Check NULLs, duplicates and ties.</li></ul>`;

FN["3_6"]=`<h3>1. Percentages</h3><p><b>Formula (percentage):</b> p% of N = ${fr("p","100")} &times; N</p><table><tr><th>Fraction</th><th>Percent</th></tr><tr><td>${fr("1","2")}</td><td>50%</td></tr><tr><td>${fr("1","3")}</td><td>33.33%</td></tr><tr><td>${fr("1","4")}</td><td>25%</td></tr><tr><td>${fr("1","5")}</td><td>20%</td></tr><tr><td>${fr("1","8")}</td><td>12.5%</td></tr><tr><td>${fr("1","10")}</td><td>10%</td></tr></table>
<p><b>Formula (percentage change):</b> % change = ${fr("New &minus; Old","Old")} &times; 100</p><p>Successive change a% then b%: net = a + b + ${fr("a &times; b","100")}</p><p><b>Example.</b> A price rises 20% then falls 20%.<br>Step 1, <i>successive change formula</i>: net = 20 + (&minus;20) + ${fr("20 &times; (&minus;20)","100")} = &minus;4<br>Answer: a net decrease of 4%.</p>
<h3>2. Profit and loss</h3><p><b>Formula (profit %):</b> Profit % = ${fr("SP &minus; CP","CP")} &times; 100 &nbsp; <b>Formula (SP):</b> SP = CP &times; ${fr("100 + P%","100")}</p><p><b>Example.</b> CP = 800, SP = 920.<br>Step 1, profit = SP &minus; CP = 120.<br>Step 2, <i>profit % formula</i>: ${fr("120","800")} &times; 100 = 15%.</p>
<p><b>Discount:</b> Discount % = ${fr("MP &minus; SP","MP")} &times; 100. Two successive discounts a% and b% equal one discount of a + b &minus; ${fr("ab","100")}.</p>
<h3>3. Ratio and proportion</h3><p>If a : b = 3 : 5 and the total is 160, then a = ${fr("3","8")} &times; 160 = 60 and b = ${fr("5","8")} &times; 160 = 100. <b>Formula (sharing):</b> share = ${fr("part","sum of parts")} &times; total.</p><p>Compound ratios multiply: (a : b) and (b : c) give a : c by making b equal. Direct proportion: x &prop; y means ${fr("x","y")} is constant.</p><h3>4. Speed tip</h3><p>Convert to a base of 100 (assume the original is 100). 15% of 80 = 10% of 80 + 5% of 80 = 8 + 4 = 12.</p>`;

FN["3_7"]=`<h3>1. Time and work</h3><p><b>Formula (rate):</b> work per day = ${fr("1","days")}</p><p><b>Formula (together):</b> days = ${fr("A &times; B","A + B")} for two people taking A and B days.</p><p><b>Example.</b> A finishes in 12 days, B in 18 days.<br>Step 1, <i>together formula</i>: ${fr("12 &times; 18","12 + 18")} = ${fr("216","30")} = 7.2 days.</p><p>Pipes: inlet is positive work, outlet is negative. Efficiency method: take LCM of the days as total work. LCM(12, 18) = 36 units; A does 3 units/day, B does 2, together 5, so 36 &divide; 5 = 7.2 days.</p>
<h3>2. Speed, distance, time</h3><p><b>Formula:</b> Speed = ${fr("Distance","Time")}. Convert: km/h &times; ${fr("5","18")} = m/s.</p><p><b>Average speed</b> for equal distances: ${fr("2xy","x + y")}.</p><p><b>Relative speed:</b> opposite directions add the speeds, same direction subtract.</p><p><b>Example.</b> A 150 m train crosses a pole in 10 s.<br>Speed = ${fr("150","10")} = 15 m/s. For a 250 m platform: time = ${fr("150 + 250","15")} = 26.67 s (train length plus platform).</p><p>Boats: downstream = u + v, upstream = u &minus; v; still-water speed = ${fr("down + up","2")}.</p>
<h3>3. Averages</h3><p><b>Formula:</b> Average = ${fr("Sum of values","Number of values")}. If a new value changes the mean of n items by d, then new value = old mean + n &times; d.</p><p><b>Weighted average:</b> ${fr("n&#8321;a&#8321; + n&#8322;a&#8322;","n&#8321; + n&#8322;")}.</p>
<h3>4. Mixtures and alligation</h3><p>Mix cheaper (c) and dearer (d) to get a mean price m: ${fr("Quantity cheaper","Quantity dearer")} = ${fr("d &minus; m","m &minus; c")}.</p><p><b>Example.</b> Rs 30 and Rs 50 per kg mixed to get Rs 42.<br>Ratio = ${fr("50 &minus; 42","42 &minus; 30")} = ${fr("8","12")} = 2 : 3 (cheaper : dearer).</p>`;

FN["3_8"]=`<h3>1. Counting principles</h3><p><b>Multiplication rule:</b> independent steps multiply. 3 shirts &times; 4 trousers = 12 outfits. <b>Addition rule:</b> either/or cases add.</p>
<h3>2. Permutations and combinations</h3><p><b>Formula (permutation, order matters):</b> nPr = ${fr("n!","(n &minus; r)!")}</p><p><b>Formula (combination, order does not matter):</b> nCr = ${fr("n!","r! (n &minus; r)!")}, and nCr = nC(n&minus;r).</p><p><b>Example.</b> Choose a team of 3 from 8.<br>Step 1, <i>combination formula</i>: 8C3 = ${fr("8 &times; 7 &times; 6","3 &times; 2 &times; 1")} = ${fr("336","6")} = 56.</p>
<table><tr><th>Case</th><th>Count</th></tr><tr><td>Arrange n different items in a row</td><td>n!</td></tr><tr><td>Arrange in a circle</td><td>(n &minus; 1)!</td></tr><tr><td>Letters with repeats (p, q alike)</td><td>${fr("n!","p! q!")}</td></tr><tr><td>Two items always together</td><td>(n &minus; 1)! &times; 2!</td></tr></table>
<h3>3. Probability</h3><p><b>Formula:</b> P(E) = ${fr("Favourable outcomes","Total outcomes")}, with 0 &le; P &le; 1.</p><p>P(not E) = 1 &minus; P(E). P(A or B) = P(A) + P(B) &minus; P(A and B). Independent events: P(A and B) = P(A) &times; P(B).</p><p><b>Example.</b> Two dice sum to 7.<br>Favourable: (1,6) (2,5) (3,4) (4,3) (5,2) (6,1) = 6 of 36.<br>P = ${fr("6","36")} = ${fr("1","6")}.</p><p><b>Cards:</b> 52 cards, 4 suits of 13; 4 kings, 12 face cards, 26 red cards. <b>Coins:</b> n coins give 2<sup>n</sup> outcomes.</p>`;
